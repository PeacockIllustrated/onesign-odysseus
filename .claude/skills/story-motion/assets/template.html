<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story Motion Template</title>
<!--
  STORY MOTION TEMPLATE — a working starter for a hand-built canvas story animation.

  Demo story, 12s: someone has an idea, it becomes a card, they throw it across the room,
  time slows as a colleague leaps to catch it, thumbs up, and the camera drifts home (seamless loop).
  It exists to show every technique in one place; replace the story, keep the engine.

  Contract (every piece):
    drawFrame(t) is a pure function of t (no Math.random, no clocks) — randomness via hash(n).
    window.renderFrame(realSeconds), window.DURATION for frame capture.
    URL params: ?t=6.5 freeze  ?ui=0 hide bar  ?portrait=1 9:16  ?native=1 exact pixels  ?style=paper
  Styles: paper · flat · chalk · neon · blueprint · cutout  (STYLES below; add your own the same way).
-->
<style>
  :root { color-scheme: light dark; --bar:#ebe5d8; --ink:#23282b; --muted:#6d6a62; --line:#d6cfbf; --accent:#4e7e8c; --page:#f3efe6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); overflow: hidden;
    font: 500 13px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: absolute; inset: 0 0 calc(60px + env(safe-area-inset-bottom, 0px)) 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  body.noui #stage { bottom: 0; padding: 0; }
  body.noui #bar { display: none; }
  canvas { display: block; border-radius: 3px; box-shadow: 0 0 0 1px var(--line), 0 14px 40px rgba(35,40,43,.12); }
  body.noui canvas { border-radius: 0; box-shadow: none; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(60px + env(safe-area-inset-bottom, 0px));
    padding: 0 16px env(safe-area-inset-bottom, 0px); display: flex; align-items: center; gap: 10px; background: var(--bar); border-top: 1px solid var(--line); }
  button, select { font: inherit; color: var(--ink); background: var(--page); border: 1.5px solid var(--ink); border-radius: 999px; height: 34px; padding: 0 12px; cursor: pointer; flex: none; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #play { width: 34px; padding: 0; display: grid; place-items: center; }
  #play svg { width: 12px; height: 12px; fill: currentColor; }
  #track { position: relative; flex: 1; min-width: 80px; height: 34px; display: flex; align-items: center; }
  #rail { position: absolute; left: 6px; right: 6px; height: 6px; border-radius: 3px; border: 1.5px solid var(--ink); }
  #scrub { position: relative; z-index: 1; width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; height: 34px; cursor: pointer; }
  #scrub::-webkit-slider-runnable-track { height: 6px; background: transparent; }
  #scrub::-moz-range-track { height: 6px; background: transparent; }
  #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--ink); }
  #scrub::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--ink); }
  .tick { position: absolute; top: 4px; bottom: 4px; width: 1.5px; background: rgba(35,40,43,.35); pointer-events: none; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 88px; text-align: right; }
  #time b { color: var(--ink); font-weight: 600; }
  @media (max-width: 620px) { #time { display: none; } #scene, #styleSel { max-width: 104px; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar">
  <button id="play" aria-label="Play / pause"></button>
  <select id="scene" aria-label="Jump to scene"></select>
  <select id="styleSel" aria-label="Visual style"></select>
  <div id="track"><div id="rail"></div><input id="scrub" type="range" min="0" max="12" step="0.001" value="0" aria-label="Scrub"></div>
  <div id="time"><b>00.00</b></div>
  <button id="orient" aria-label="Toggle orientation">16:9</button>
</div>
<script>
'use strict';

/* ==========================================================================
   SETTINGS: story length, scenes, beats, styles, cast. Tune here.
   ========================================================================== */

const STORY_END = 12;                 // story seconds; real length is DURATION (time warps change it)
const FPS = 60;

const SCENES = [
  { id: 1, name: 'The idea',   t0: 0,   t1: 2.5 },
  { id: 2, name: 'The throw',  t0: 2.5, t1: 4.0 },
  { id: 3, name: 'The catch',  t0: 4.0, t1: 7.8 },
  { id: 4, name: 'Back to it', t0: 7.8, t1: STORY_END },
];

// Beat sheet. Every time in the piece is a key here (or derived from one) — retime here, not in functions.
const T = {
  bulb: 1.0, bulbDive: [2.1, 2.5], onScreen: 2.5,
  reach: [3.1, 3.4], peel: [3.4, 3.7], windup: [3.7, 4.0], flight: [4.0, 7.0],
  notice: 5.0, crouch: [6.25, 6.55], leap: [6.55, 7.0], land: [7.0, 7.45],
  thumbs: 7.8, cheer: [8.0, 9.2], home: [9.6, 11.4],
  slow: { at: [6.62, 7.22], k: 0.12, ramp: 0.08 },     // slow motion across the catch
};

// A style is a palette (semantic roles) + a way of drawing shapes. Scenes only ever name roles.
//   render: ink | flat | chalk | neon | blueprint | cutout (see shape())
//   stroke: outline width   boil: wobble amplitude (screen px)   boilEvery: frames per re-seed
//   grain:  paper texture strength   vignette: edge darkening (vignetteRGB tints it; slowVignette is the extra in slow motion)
const STYLES = {
  paper: {
    label: 'Paper & ink', render: 'ink', stroke: 3.4, boil: 1.25, boilEvery: 3, grain: 1, vignette: 0.10,
    C: { page: '#f3efe6', wall: '#f3efe6', floor: '#e6dfd1', ink: '#23282b', desk: '#d9c7a8', screen: '#eceee9', card: '#fbf8f1',
         a1: '#4e7e8c', a2: '#e9b44c', a3: '#e07a5f', a4: '#a8c3ca', c1: '#e9b44c', c2: '#cf5c78', glow: '#ffe7a3' },
  },
  flat: {
    label: 'Flat vector', render: 'flat', stroke: 0, boil: 0, boilEvery: 1, grain: 0, vignette: 0, slowVignette: 0.08, vignetteRGB: '31,42,68',
    C: { page: '#eef1f6', wall: '#eef1f6', floor: '#d5dbe8', ink: '#1f2a44', desk: '#b8c2d9', screen: '#ffffff', card: '#ffffff',
         a1: '#3d5afe', a2: '#ffb400', a3: '#ff5a5f', a4: '#00b3a4', c1: '#ff5a5f', c2: '#3d5afe', glow: '#ffe07a' },
  },
  chalk: {
    label: 'Chalkboard', render: 'chalk', stroke: 3, boil: 2.2, boilEvery: 4, grain: 0.6, vignette: 0.25, vignetteRGB: '8,20,16',
    C: { page: '#1f3b33', wall: '#22433a', floor: '#1b3730', ink: '#f4f1e8', desk: '#c9b89a', screen: '#2c5146', card: '#f4f1e8',
         a1: '#9fd8cb', a2: '#fbe38e', a3: '#f7a3ad', a4: '#b5c9f5', c1: '#fbe38e', c2: '#f7a3ad', glow: '#fff4c2' },
  },
  neon: {
    label: 'Neon night', render: 'neon', stroke: 3, boil: 0.4, boilEvery: 3, grain: 0, vignette: 0.35, vignetteRGB: '0,0,0',
    C: { page: '#0b0d17', wall: '#0f1222', floor: '#0b0d17', ink: '#e8ecff', desk: '#6a6f99', screen: '#161a33', card: '#e8ecff',
         a1: '#00e5ff', a2: '#ffe600', a3: '#ff3df2', a4: '#7cff4f', c1: '#ff3df2', c2: '#00e5ff', glow: '#ffe600' },
  },
  blueprint: {
    label: 'Blueprint', render: 'blueprint', stroke: 2, boil: 0, boilEvery: 1, grain: 0, vignette: 0.15, vignetteRGB: '6,20,40',
    C: { page: '#174a7c', wall: '#174a7c', floor: '#15426f', ink: '#eaf4ff', desk: '#eaf4ff', screen: '#1d5791', card: '#eaf4ff',
         a1: '#9fd3ff', a2: '#ffd36b', a3: '#ff9f9f', a4: '#b9f2d0', c1: '#ffd36b', c2: '#9fd3ff', glow: '#ffd36b' },
  },
  cutout: {
    label: 'Cut paper', render: 'cutout', stroke: 0, boil: 0.7, boilEvery: 6, grain: 1, vignette: 0.08,
    C: { page: '#efe7da', wall: '#e8dcc8', floor: '#d9c7a6', ink: '#3b2f2a', desk: '#b98b5f', screen: '#fffaf0', card: '#fffaf0',
         a1: '#0e7c7b', a2: '#f0a202', a3: '#d95d39', a4: '#7b9e89', c1: '#f0a202', c2: '#d95d39', glow: '#ffd98a' },
  },
};
const ACCENT_ROLES = new Set(['a1', 'a2', 'a3', 'a4', 'c1', 'c2', 'glow']);

// Cast. shape: pill | round | square. A brand can swap the body for its own mark (see drawBody hook).
const CAST = {
  maker:   { shape: 'square', w: 150, h: 132, legLen: 50, color: 'c1', eyeGap: 38, eyeY: 0.62, eyeR: 7, k: 1.2 },
  catcher: { shape: 'pill',   w: 110, h: 176, legLen: 62, color: 'c2', eyeGap: 32, eyeY: 0.72, eyeR: 6.5, k: 1.25 },
};

const WORLD = { floor: 880, x0: -700, x1: 2700 };
const DESK = { x0: 600, x1: 920, y: 700 };
const SCREEN = { cx: 770, cy: 600, w: 170, h: 112 };
const MAKER_X = 500, CATCHER_X = 1820;
const PORTRAIT_VIEW = { fit: 1.3 };   // 9:16 sees ~830 wide × ~1477 tall world units ÷ zoom (16:9: 1920 × 1080 ÷ zoom). Compose for 9:16 first

/* ==========================================================================
   Easing, springs, paths, hashing — all pure.
   ========================================================================== */

const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const lerp = (a, b, u) => a + (b - a) * u;
const lerp2 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
const prog = (t, a, b) => clamp01((t - a) / (b - a));
const E = {
  inOutSine: u => -(Math.cos(Math.PI * u) - 1) / 2,
  inCubic: u => u * u * u, outCubic: u => 1 - Math.pow(1 - u, 3),
  inOutCubic: u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2,
  outBack: u => { const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  outBackBig: u => { const c = 2.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
};
const settle = (t, w = 16, z = 0.3) => t <= 0 ? 0 : Math.exp(-z*w*t) * Math.sin(w*Math.sqrt(1 - z*z)*t);
function keys(t, k) {                  // piecewise keyframes: [[t, value, easing?], ...]
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [t0, v0] = k[i-1], [t1, v1, e] = k[i]; return lerp(v0, v1, (e || E.inOutCubic)((t - t0) / (t1 - t0))); }
  return k[k.length - 1][1];
}
function keys2(t, k) { return [keys(t, k.map(([t0, p, e]) => [t0, p[0], e])), keys(t, k.map(([t0, p, e]) => [t0, p[1], e]))]; }   // keys() for points: hands, props
const cyc = (t, n, ph = 0) => Math.sin(2 * Math.PI * n * t / STORY_END + ph);   // idle motion that loops exactly
function hash(n) { let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
function catmull(P, u) {
  const n = P.length - 1, x = clamp01(u) * n, i = Math.min(n - 1, Math.floor(x)), s = x - i;
  const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(n, i + 2)];
  const f = (a, b, c, d) => 0.5 * (2*b + (-a + c)*s + (2*a - 5*b + 4*c - d)*s*s + (-a + 3*b - 3*c + d)*s*s*s);
  return [f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])];
}
function arcPath(P, n = 400) {          // spline sampled by arc length: speed along it is exactly what the easing says
  const pts = []; for (let i = 0; i <= n; i++) pts.push(catmull(P, i / n));
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function pathAt(A, s) {
  const d = clamp01(s) * A.len; let lo = 0, hi = A.cum.length - 1;
  while (lo < hi - 1) { const m = (lo + hi) >> 1; if (A.cum[m] <= d) lo = m; else hi = m; }
  return lerp2(A.pts[lo], A.pts[hi], (d - A.cum[lo]) / ((A.cum[hi] - A.cum[lo]) || 1));
}

// Time warp: beats are authored in story time; speedAt(s) maps it to real time. Slow motion = speed < 1.
const speedAt = s => { const S = T.slow, env = E.inOutSine(prog(s, S.at[0] - S.ramp, S.at[0])) * (1 - E.inOutSine(prog(s, S.at[1], S.at[1] + S.ramp))); return lerp(1, S.k, env); };
const WARP = (() => { const ds = 0.001, n = Math.ceil(STORY_END / ds), r = new Float64Array(n + 1); for (let i = 1; i <= n; i++) r[i] = r[i-1] + ds / speedAt((i - 0.5) * ds); return { ds, n, r }; })();
const DURATION = WARP.r[WARP.n];
function realAt(st) { const x = clamp01(st / STORY_END) * WARP.n, i = Math.min(WARP.n - 1, Math.floor(x)); return lerp(WARP.r[i], WARP.r[i + 1], x - i); }
function storyAt(rt) { let lo = 0, hi = WARP.n; if (rt <= 0) return 0; if (rt >= WARP.r[hi]) return STORY_END; while (lo < hi - 1) { const m = (lo + hi) >> 1; if (WARP.r[m] <= rt) lo = m; else hi = m; } return (lo + (rt - WARP.r[lo]) / (WARP.r[hi] - WARP.r[lo])) * WARP.ds; }

/* ==========================================================================
   Drawing: one shape() primitive; the style decides how a shape is rendered.
   ========================================================================== */

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let STYLE = STYLES.paper, BASE_SCALE = 1, CAM_ZOOM = 1, BOIL = 0, STROKE = 0, W = 1920, H = 1080, PORTRAIT = false, K = 1, grain = null;
const _warned = new Set();
const col = r => {                        // role → colour. Unknown roles pass through as literal colours; warn once so a
  if (STYLE.C[r]) return STYLE.C[r];      // role added to one style but not the others doesn't silently draw black
  if (typeof r === 'string' && !/^(#|rgb|hsl)/.test(r) && !_warned.has(r)) { _warned.add(r); console.warn(`style "${STYLE.label}" has no role "${r}"`); }
  return r;
};
const worldScale = () => { const m = ctx.getTransform(); return Math.max(0.05, Math.sqrt(Math.abs(m.a * m.d - m.b * m.c))) / BASE_SCALE; };

function boil(pts, amp, closed) {       // hand-drawn wobble, re-seeded every STYLE.boilEvery frames
  const id = STROKE++;
  if (!amp || pts.length < 2) return pts;
  const A = amp / worldScale();
  let total = 0; const L = [0];
  for (let i = 1; i < pts.length; i++) { total += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); L.push(total); }
  if (closed) total += Math.hypot(pts[0][0] - pts[pts.length-1][0], pts[0][1] - pts[pts.length-1][1]);
  const k1 = Math.max(2, Math.round(total * worldScale() * 0.03 / (2 * Math.PI))), k2 = k1 * 2 + 1;
  const ph = [1, 2, 3, 4].map(j => hash(BOIL * 7919 + id * 131 + j) * Math.PI * 2);
  return pts.map((p, i) => { const a = (L[i] / (total || 1)) * Math.PI * 2;
    return [p[0] + A * (Math.sin(k1*a + ph[0]) + 0.5*Math.sin(k2*a + ph[1])) / 1.5, p[1] + A * (Math.sin(k1*a + ph[2]) + 0.5*Math.sin(k2*a + ph[3])) / 1.5]; });
}
function trace(P, closed) { ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); if (closed) ctx.closePath(); }
function strokeP(P, closed, color, w) { trace(P, closed); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function fillP(P, color) { trace(P, true); ctx.fillStyle = color; ctx.fill(); }

// shape(points, { fill: role|hex, closed=true, stroke: role|false, w, amp, alpha })
function shape(pts, o = {}) {
  const closed = o.closed !== false, S = STYLE, fillRole = closed ? o.fill : null;
  const fill = fillRole ? col(fillRole) : null, w = o.w ?? (S.stroke || 3), strokeRole = o.stroke ?? 'ink';
  ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  const P = boil(pts, (o.amp ?? 1) * S.boil, closed);
  switch (S.render) {
    case 'ink':        // flat fill + a boiling ink outline
      if (fill) fillP(P, fill);
      if (strokeRole !== false) strokeP(P, closed, col(strokeRole), w);
      break;
    case 'flat':       // crisp fills, no outlines; open lines keep a stroke
      if (fill) fillP(P, fill); else if (strokeRole !== false) strokeP(P, false, col(strokeRole), o.w ?? 5);
      break;
    case 'cutout':     // paper pieces with a hard cast shadow, no outlines
      if (fill) { ctx.shadowColor = 'rgba(50,30,15,0.24)'; ctx.shadowOffsetX = 3 * K; ctx.shadowOffsetY = 5 * K; fillP(P, fill); ctx.shadowColor = 'transparent'; }
      else if (strokeRole !== false) strokeP(P, false, col(strokeRole), o.w ?? 5);
      break;
    case 'chalk': {    // translucent fill, two scratchy passes of chalk on the line
      if (fill) { const a = ctx.globalAlpha; ctx.globalAlpha = a * 0.32; fillP(P, fill); ctx.globalAlpha = a; }
      if (strokeRole !== false) {
        const c = col(fillRole && ACCENT_ROLES.has(fillRole) ? fillRole : strokeRole), a = ctx.globalAlpha;
        ctx.globalAlpha = a * 0.75; strokeP(P, closed, c, w);
        ctx.globalAlpha = a * 0.4; strokeP(boil(pts, S.boil * 1.4, closed), closed, c, w * 0.6);
        ctx.globalAlpha = a;
      }
      break;
    }
    case 'neon': {     // dark fill, glowing tube in the shape's own colour
      if (fill) { const a = ctx.globalAlpha; ctx.globalAlpha = a * (ACCENT_ROLES.has(fillRole) ? 0.14 : 1); fillP(P, ACCENT_ROLES.has(fillRole) ? fill : col('wall')); ctx.globalAlpha = a; }
      if (strokeRole !== false) {
        const c = fillRole && (ACCENT_ROLES.has(fillRole) || fillRole === 'card') ? fill : col(strokeRole);
        ctx.shadowColor = c; ctx.shadowBlur = 14 * K * CAM_ZOOM; strokeP(P, closed, c, w); ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
      }
      break;
    }
    case 'blueprint':  // ghosted fill, fine white line
      if (fill) { const a = ctx.globalAlpha; ctx.globalAlpha = a * (ACCENT_ROLES.has(fillRole) ? 0.35 : 0.08); fillP(P, fill); ctx.globalAlpha = a; }
      if (strokeRole !== false) strokeP(P, closed, col(strokeRole), w);
      break;
  }
  ctx.restore();
}
const line = (pts, o = {}) => shape(pts, { ...o, closed: false });
// Text for end cards and UI in scenes. A real logo should be its SVG path (new Path2D(d)), never typed.
function label(text, x, y, size, role = 'ink', weight = 700, font = 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif') {
  ctx.fillStyle = col(role); ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y);
}
function dot(x, y, r, role = 'ink') {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col(role);
  if (STYLE.render === 'neon') { ctx.shadowColor = col(role); ctx.shadowBlur = 10 * K * CAM_ZOOM; }
  ctx.fill(); ctx.shadowBlur = 0;
}
function seg(a, b, step = 22) { const n = Math.max(1, Math.ceil(Math.hypot(b[0]-a[0], b[1]-a[1]) / step)), out = []; for (let i = 0; i <= n; i++) out.push(lerp2(a, b, i / n)); return out; }
function poly(c, closed = true) { const out = [], n = c.length, m = closed ? n : n - 1; for (let i = 0; i < m; i++) out.push(...seg(c[i], c[(i + 1) % n]).slice(0, -1)); if (!closed) out.push(c[n - 1]); return out; }
const rect = (x, y, w, h) => poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]]);
function rrect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); const out = [], arc = (cx, cy, a0) => { for (let i = 0; i <= 6; i++) { const a = a0 + i / 6 * Math.PI / 2; out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
  out.push(...seg([x + r, y], [x + w - r, y]).slice(0, -1)); arc(x + w - r, y + r, -Math.PI / 2);
  out.push(...seg([x + w, y + r], [x + w, y + h - r]).slice(1, -1)); arc(x + w - r, y + h - r, 0);
  out.push(...seg([x + w - r, y + h], [x + r, y + h]).slice(1, -1)); arc(x + r, y + h - r, Math.PI / 2);
  out.push(...seg([x, y + h - r], [x, y + r]).slice(1, -1)); arc(x + r, y + r, Math.PI);
  return out;
}
function ellipse(cx, cy, rx, ry, n = 32) { const o = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return o; }

  const r = ((tIn % DURATION) + DURATION) % DURATION, t = storyAt(r);
  BOIL = Math.floor(r * FPS / STYLE.boilEvery); STROKE = 0;
  const fit = PORTRAIT ? PORTRAIT_VIEW.fit : 1; BASE_SCALE = K * fit;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.fillStyle = col('page'); ctx.fillRect(0, 0, canvas.width, canvas.height);
  const c = camera(t); if (PORTRAIT && c.pz) c.zoom = c.pz; CAM_ZOOM = c.zoom;
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.translate(W / 2, H / 2); ctx.scale(fit * c.zoom, fit * c.zoom); ctx.translate(-c.cx, -c.cy);
  drawSet(t);
  drawCharacter(CAST.maker, makerState(t));
  drawCharacter(CAST.catcher, catcherState(t));
  drawBulb(t);
  const cp = cardPose(t); if (cp && cp.p && t > T.flight[0] && t < T.flight[1]) ghosted(t, drawCard, 4, 0.05); else drawCard(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (STYLE.grain && grain) { ctx.globalAlpha = STYLE.grain; ctx.fillStyle = grain; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalAlpha = 1; }
  const slow = 1 - speedAt(t), v = STYLE.vignette + (STYLE.slowVignette ?? 0.18) * Math.max(0, slow);   // vignette deepens in slow motion
  if (v > 0) { const rgb = STYLE.vignetteRGB || '20,16,10', g = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.35, canvas.width / 2, canvas.height / 2, Math.hypot(canvas.width, canvas.height) * 0.6);
    g.addColorStop(0, `rgba(${rgb},0)`); g.addColorStop(1, `rgba(${rgb},${v.toFixed(3)})`); ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height); }
}

/* ==========================================================================
   Canvas sizing + review controls (the only code that reads a clock).
   ========================================================================== */

const params = new URLSearchParams(location.search);
const NATIVE = params.get('native') === '1';
if (params.get('ui') === '0') document.body.classList.add('noui');
PORTRAIT = params.get('portrait') === '1';
STYLE = STYLES[params.get('style')] || STYLES.paper;

function resize() {
  W = PORTRAIT ? 1080 : 1920; H = PORTRAIT ? 1920 : 1080;
  const stage = document.getElementById('stage'), pad = document.body.classList.contains('noui') ? 0 : 24;
  const aw = stage.clientWidth - pad, ah = stage.clientHeight - pad, cssW = Math.max(10, Math.min(aw, ah * W / H)), cssH = cssW * H / W;
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  const dpr = window.devicePixelRatio || 1;
  canvas.width = NATIVE ? W : Math.max(2, Math.round(cssW * dpr)); canvas.height = NATIVE ? H : Math.max(2, Math.round(cssH * dpr));
  K = canvas.width / W; if (!grain) buildGrain();
  document.getElementById('orient').textContent = PORTRAIT ? '9:16' : '16:9';
  drawFrame(currentTime());
}
const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), sceneSel = document.getElementById('scene'), styleSel = document.getElementById('styleSel');
const ICON_PLAY = '<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>';
let playing = !params.has('t'), origin = performance.now(), held = params.has('t') ? parseFloat(params.get('t')) || 0 : 0, scrubbing = false;
function currentTime() { return playing ? ((performance.now() - origin) / 1000) % DURATION : held; }
function setPlaying(p) { const t = currentTime(); playing = p; if (p) origin = performance.now() - t * 1000; else held = t; playBtn.innerHTML = p ? ICON_PAUSE : ICON_PLAY; }
function seek(t) { held = ((t % DURATION) + DURATION) % DURATION; origin = performance.now() - held * 1000; drawFrame(held); updateUI(held); }
function updateUI(t) {
  if (!scrubbing) scrub.value = t.toFixed(3);
  timeEl.innerHTML = `<b>${t.toFixed(2).padStart(5, '0')}</b> / ${DURATION.toFixed(2)}`;
  const st = storyAt(t), sc = SCENES.find(s => st >= s.t0 && st < s.t1); if (sc && document.activeElement !== sceneSel) sceneSel.value = String(sc.id);
}
scrub.max = DURATION.toFixed(3);
SCENES.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = `${s.id}. ${s.name}`; sceneSel.appendChild(o);
  if (s.t0 > 0) { const d = document.createElement('div'); d.className = 'tick'; d.style.left = `calc(6px + (100% - 12px) * ${realAt(s.t0) / DURATION})`; document.getElementById('track').appendChild(d); } });
Object.entries(STYLES).forEach(([k, s]) => { const o = document.createElement('option'); o.value = k; o.textContent = s.label; if (STYLES[k] === STYLE) o.selected = true; styleSel.appendChild(o); });
playBtn.addEventListener('click', () => setPlaying(!playing));
scrub.addEventListener('input', () => { scrubbing = true; if (playing) setPlaying(false); seek(parseFloat(scrub.value)); });
scrub.addEventListener('change', () => { scrubbing = false; });
sceneSel.addEventListener('change', () => { const s = SCENES.find(x => x.id === +sceneSel.value); seek(realAt(s.t0)); if (!playing) setPlaying(true); });
styleSel.addEventListener('change', () => { STYLE = STYLES[styleSel.value]; drawFrame(currentTime()); });
document.getElementById('orient').addEventListener('click', () => { PORTRAIT = !PORTRAIT; resize(); });
window.addEventListener('keydown', e => {
  if (e.target === sceneSel || e.target === styleSel) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { e.preventDefault(); if (playing) setPlaying(false); seek(currentTime() + (e.code === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 1 / FPS)); }
});
window.addEventListener('resize', resize);
function loop() { if (playing) { const t = currentTime(); drawFrame(t); updateUI(t); } requestAnimationFrame(loop); }
playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
resize(); updateUI(currentTime()); requestAnimationFrame(loop);

window.renderFrame = t => { if (playing) setPlaying(false); held = t; drawFrame(t); updateUI(((t % DURATION) + DURATION) % DURATION); };
window.setStyle = k => { STYLE = STYLES[k] || STYLE; drawFrame(currentTime()); };
window.DURATION = DURATION;
</script>
