<title>Bloom Sign Story Videos</title>
<!-- Template for delivering a motion piece: change the title, heading, copy and the two meta lines.
     Publish with the web encodes in the artifact files map as bloom-mobile.mp4 / bloom-desktop.mp4
     (or rename both here and in the map). Each file must be 15 MB or less. -->
<style>
  :root { color-scheme: light; --paper: #f3efe6; --ink: #23282b; --muted: #6d6a62; --teal: #4e7e8c; --line: #d6cfbf; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 500 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px; display: grid; gap: 36px; }
  header h1 { margin: 0 0 4px; font-size: clamp(24px, 4vw, 34px); letter-spacing: -0.01em; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); max-width: 62ch; }
  section { display: grid; gap: 10px; }
  h2 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
  .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  video { display: block; width: 100%; height: auto; border-radius: 6px; box-shadow: 0 0 0 1.5px var(--ink), 0 14px 36px rgba(35,40,43,.12); background: #e8e2d6; }
  .mobile video { max-width: 420px; aspect-ratio: 9 / 16; }
  .desktop video { aspect-ratio: 16 / 9; }
  video:focus-visible { outline: 2px solid var(--teal); outline-offset: 4px; }
</style>
<main>
  <header>
    <h1>Bloom: a sign made by Onesign</h1>
    <p>From the customer's first thought to a lit fascia, in one continuous take. Both cuts loop seamlessly.</p>
  </header>
  <section class="mobile">
    <h2>Mobile · 9:16</h2>
    <video src="bloom-mobile.mp4" controls muted loop playsinline preload="metadata"></video>
    <div class="meta">1080 × 1920 · 60 fps · 41.7 s · H.264</div>
  </section>
  <section class="desktop">
    <h2>Desktop · 16:9</h2>
    <video src="bloom-desktop.mp4" controls muted loop playsinline preload="metadata"></video>
    <div class="meta">1920 × 1080 · 60 fps · 41.7 s · H.264</div>
  </section>
</main>
