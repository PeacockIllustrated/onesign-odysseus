<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onesign & Digital — Fitting Board</title>
<style>
  /* =========================================================
     Onesign & Digital — Fitting Board
     Visual language borrowed from OneLaser (One Group):
     near-black teal ground, steel chrome, lowercase labels,
     monospaced data, hairline rules, one hot "cut edge" accent.
     ========================================================= */
  :root{
    /* ---------- dark (workshop / TV default) ---------- */
    --bg:#0C1315; --panel:#111B1E; --panel2:#0E1719; --sunk:#0A1214;
    --line:#1D2B2F; --line2:#2A3C41;
    --text:#EAF1F2; --muted:#93A7AC; --faint:#61767B;
    --steel:#E8EFF0; --steel-ink:#0C1315;
    --cut:#FF6A2B; --cut-dim:rgba(255,106,43,.14);
    --headbg:rgba(12,19,21,.94);
    --bggrad:linear-gradient(180deg,#101A1D 0%,#0C1315 320px);
    --shadow:0 4px 14px rgba(0,0,0,.5);
    --modalveil:rgba(6,10,11,.82);
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
  }
  body.light{
    /* ---------- light (office desks) ---------- */
    --bg:#F2F1ED; --panel:#FFFFFF; --panel2:#FAFAF8; --sunk:#F2F1ED;
    --line:#DCDAD3; --line2:#C7C4BA;
    --text:#0C1315; --muted:#5A6A6E; --faint:#8A9499;
    --steel:#0C1315; --steel-ink:#FFFFFF;
    --cut:#E0561C; --cut-dim:rgba(224,86,28,.11);
    --headbg:rgba(242,241,237,.94);
    --bggrad:linear-gradient(180deg,#FFFFFF 0%,#F2F1ED 320px);
    --shadow:0 3px 10px rgba(12,19,21,.10);
    --modalveil:rgba(12,19,21,.42);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:var(--bggrad);
    background-repeat:no-repeat;
  }
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{
    font-family:inherit; width:100%; background:var(--sunk); border:1px solid var(--line2);
    border-radius:2px; padding:9px 11px; color:var(--text); font-size:13px;
  }
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--cut); box-shadow:0 0 0 3px var(--cut-dim);}
  a{color:inherit;}
  ::selection{background:var(--cut); color:#fff;}

  /* ---------- header ---------- */
  header{position:sticky; top:0; z-index:30; background:var(--headbg); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .bar{display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:12px 18px;}
  .brand{display:flex; align-items:center; gap:11px; margin-right:8px;}
  .logo{font-weight:800;}
  .logoOLD{font-weight:800; font-size:21px; letter-spacing:-.035em; line-height:1;}
  .logo .dot{color:var(--cut);}
  .brandrule{width:1px; height:22px; background:var(--line2);}
  .sub{font-size:10px; letter-spacing:.24em; text-transform:lowercase; color:var(--muted); font-family:var(--mono);}

  .seg{display:flex; border:1px solid var(--line2); border-radius:2px; overflow:hidden;}
  .seg button{padding:8px 17px; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:lowercase; background:transparent; color:var(--muted); border-right:1px solid var(--line2);}
  .seg button:last-child{border-right:none;}
  .seg button:hover{background:var(--sunk); color:var(--text);}
  .seg button.on{background:var(--steel); color:var(--steel-ink); font-weight:700;}
  .navbtn{width:34px; height:34px; border:1px solid var(--line2); border-radius:2px; font-size:15px; color:var(--muted);}
  .navbtn:hover,.pill:hover{background:var(--sunk); color:var(--text); border-color:var(--line2);}
  .pill{height:34px; padding:0 13px; border:1px solid var(--line2); border-radius:2px; font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:lowercase; color:var(--muted);}
  .pill.on{background:var(--steel); color:var(--steel-ink); border-color:var(--steel); font-weight:700;}
  #title{font-size:16px; font-weight:600; letter-spacing:-.01em;}
  .right{margin-left:auto; display:flex; align-items:center; gap:8px;}
  #saved{font-size:10px; color:var(--faint); font-family:var(--mono);}

  .legend{display:flex; flex-wrap:wrap; gap:18px; align-items:center; padding:0 18px 10px; font-size:11px; color:var(--muted);}
  .legend .l{display:flex; align-items:center; gap:7px; font-weight:600; letter-spacing:.02em;}
  .swatch{width:10px; height:10px; border-radius:1px;}
  .legend .end{margin-left:auto; color:var(--faint); font-weight:400; font-family:var(--mono); font-size:10px;}
  .draghint{color:var(--faint); font-weight:400; font-size:10px; font-family:var(--mono);}

  main{padding:16px 18px 28px;}
  .weekwrap{display:flex; gap:14px; align-items:flex-start;}
  .boardcol{flex:1; min-width:0;}

  /* ---------- grid ---------- */
  .grid{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:3px; overflow:hidden;}
  .hcell{background:var(--panel); padding:11px 8px; text-align:center;}
  .hcell .van{font-weight:700; text-transform:lowercase; letter-spacing:.02em; font-size:15px;}
  .hcell .crew{font-size:11px; color:var(--muted); font-family:var(--mono); margin-top:2px;}
  .dcell{background:var(--panel); padding:10px 9px; position:relative;}
  .dcell .dname{font-weight:600; font-size:13px; text-transform:lowercase; letter-spacing:.01em;}
  .dcell .ddate{font-size:10px; color:var(--faint); font-family:var(--mono); margin-top:1px;}
  .dcell.today{background:var(--cut-dim);}
  .dcell.today::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--cut);}
  .dcell.today .dname{color:var(--cut);}
  .dcell.wkend{background:var(--sunk);} .dcell.wkend .dname{color:var(--faint);}
  .crewbtn{display:inline-block; margin-top:7px; font-size:9px; font-weight:700; text-transform:lowercase; letter-spacing:.1em; color:var(--faint); border:1px solid var(--line2); border-radius:2px; padding:3px 7px; font-family:var(--mono);}
  .crewbtn:hover{color:var(--text); border-color:var(--muted);}
  .daytag{display:inline-block; margin-top:7px; font-size:9px; font-weight:700; background:var(--cut-dim); color:var(--cut); border:1px solid rgba(255,106,43,.4); border-radius:2px; padding:2px 7px; text-transform:lowercase; letter-spacing:.08em; font-family:var(--mono);}
  .holtag{display:block; margin-top:5px; font-size:10px; color:#7FB6C4; font-weight:500; font-family:var(--mono);}
  .cell{background:var(--panel2); padding:7px; min-height:108px; display:flex; flex-direction:column; gap:6px;}
  .cell.wkend{background:var(--sunk);}
  .crewbadge{font-size:9px; font-weight:700; border-radius:2px; padding:3px 7px; width:fit-content; background:var(--cut-dim); color:var(--cut); border:1px solid rgba(255,106,43,.35); font-family:var(--mono); letter-spacing:.06em;}
  .crewbadge.bad{background:rgba(220,38,38,.15); color:#F87171; border-color:rgba(220,38,38,.45);}

  .cellsplit{display:flex; flex-direction:column; gap:5px; flex:1;}
  .ampmcol{display:flex; flex-direction:column; gap:5px;}
  .ampmcol.hidden{display:none;}
  body.dragging .ampmcol.hidden{display:flex;}
  .dayrow{display:none; flex-direction:column; width:100%;}
  .dayrow.show{display:flex;}
  .daydrop{display:flex; align-items:center; justify-content:center; border:1px dashed var(--line2); border-radius:2px; color:var(--faint); font-size:9px; font-weight:700; text-transform:lowercase; letter-spacing:.1em; padding:7px 0; font-family:var(--mono);}
  .slimadd{display:flex; gap:5px;}
  .slimadd button{flex:1; border:1px dashed var(--line2); color:var(--faint); font-size:10px; border-radius:2px; padding:3px 0; font-family:var(--mono);}
  .slimadd button:hover{color:var(--text); border-color:var(--muted);}
  body.dragging .slimadd{display:none;}

  .slot{display:flex; gap:6px;}
  .slotlabel{flex-shrink:0; width:26px; text-align:center; background:var(--sunk); border:1px solid var(--line); color:var(--faint); font-weight:700; font-size:9px; padding:3px 0; border-radius:2px; height:fit-content; text-transform:lowercase; letter-spacing:.06em; font-family:var(--mono);}
  .slotlabel.ooh{border-color:rgba(255,106,43,.35); color:var(--cut);}
  .slotjobs{flex:1; min-width:0; border-radius:2px;}
  .addbtn{width:100%; border:1px dashed var(--line2); color:var(--faint); font-size:10px; border-radius:2px; padding:3px 0; margin-top:2px; font-family:var(--mono);}
  .addbtn:hover{color:var(--text); border-color:var(--muted);}

  /* ---------- drag & drop ---------- */
  .card[draggable="true"], .chip[draggable="true"]{cursor:grab;}
  .card.dragsrc, .chip.dragsrc{opacity:.3;}
  body.dragging .slotjobs, body.dragging .vslot{outline:1px dashed var(--line2); outline-offset:1px; min-height:22px;}
  .slotjobs.dragover, .vslot.dragover, .dayrow.dragover, .backloglist.dragover{outline:1px solid var(--cut) !important; background:var(--cut-dim); border-radius:2px;}
  .oohrow{display:none;}
  .oohrow.show{display:flex;}
  body.dragging .oohrow{display:flex;}

  /* ---------- job card ---------- */
  .card{width:100%; text-align:left; border-radius:2px; border-left:3px solid; padding:7px 9px; margin-bottom:6px; transition:transform .08s, box-shadow .08s;}
  .card:hover{transform:translateY(-1px); box-shadow:var(--shadow);}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
  .card .name{font-weight:700; font-size:12.5px; line-height:1.25; letter-spacing:-.005em;}
  .card .fitted{flex-shrink:0; font-size:9px; font-weight:800; font-family:var(--mono); letter-spacing:.04em;}
  .card .meta{font-size:10px; opacity:.78; font-weight:500; display:flex; flex-wrap:wrap; gap:0 8px; font-family:var(--mono); margin-top:2px;}
  .card .extra{font-size:10px; opacity:.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .card.done{opacity:.62;} .card.done .name{text-decoration:line-through;}
  .card.allday{width:100%; margin-bottom:0; border-left-width:4px;}
  .card.allday + .card.allday{margin-top:5px;}
  .alldaytag{font-size:8px; font-weight:800; letter-spacing:.16em; text-transform:lowercase; opacity:.6; display:block; margin-bottom:3px; font-family:var(--mono);}
  .chip{display:block; width:100%; text-align:left; border-radius:2px; border-left:3px solid; padding:3px 6px; margin-bottom:2px; font-size:10px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip.done{opacity:.55; text-decoration:line-through;}

  /* PM colours — matte panels on dark ground, colour = whose job it is */
  .pm-mak{background:#16324D; border-color:#4C9BE8; color:#DCEBFA;}
  .pm-chris{background:#40320E; border-color:#E8B04C; color:#FAEFD8;}
  .pm-michael{background:#4A1D1D; border-color:#E86A6A; color:#FADCDC;}
  .pm-adam{background:#153A2C; border-color:#4CC98D; color:#D9F5E7;}
  .sw-mak{background:#4C9BE8;} .sw-chris{background:#E8B04C;} .sw-michael{background:#E86A6A;} .sw-adam{background:#4CC98D;}

  /* ---------- backlog sidebar ---------- */
  .sidebar{width:252px; flex-shrink:0; display:flex; flex-direction:column; gap:12px;}
  .holding{border:1px solid var(--line); background:var(--panel); border-radius:3px; overflow:hidden;}
  .bhead{padding:11px 13px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;}
  .bhead b{font-size:11px; text-transform:lowercase; letter-spacing:.14em; font-weight:700; font-family:var(--mono); color:var(--muted);}
  .bhead .cnt{background:var(--cut); color:#fff; font-size:10px; font-weight:800; border-radius:2px; padding:1px 7px; font-family:var(--mono);}
  .backloglist{padding:10px; min-height:104px; max-height:38vh; overflow-y:auto;}
  .bempty{text-align:center; font-size:10px; color:var(--faint); padding:22px 6px; line-height:1.5;}
  .bactions{padding:0 10px 10px; display:flex; gap:6px;}
  .bactions button{flex:1; font-size:10px; font-weight:700; border:1px solid var(--line2); border-radius:2px; padding:6px 0; color:var(--muted); font-family:var(--mono); letter-spacing:.04em;}
  .bactions button:hover{color:var(--text); border-color:var(--muted);}
  .bnote{padding:0 13px 11px; font-size:10px; color:var(--faint); line-height:1.45;}

  /* ---------- month view ---------- */
  .mwrap{overflow-x:auto;}
  .mgrid{min-width:950px;}
  .wchead{background:var(--panel); padding:8px 4px; text-align:center;}
  .wchead .wc{font-weight:700; font-size:12px; background:none; font-family:var(--mono); letter-spacing:.02em;}
  .wchead .wc:hover{color:var(--cut);}
  .subvans{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin-top:4px;}
  .subvans span{font-size:9px; color:var(--faint); font-weight:700; text-transform:lowercase; overflow:hidden; text-overflow:ellipsis; font-family:var(--mono);}
  .mcell{padding:2px; background:var(--panel2);}
  .mcell.out{background:var(--sunk);}
  .mcell .tri{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; height:100%;}
  .mcell .vslot{min-height:38px; background:var(--sunk); border-radius:2px; padding:2px;}

  /* ---------- year view ---------- */
  .ytotals{display:flex; flex-wrap:wrap; gap:20px; align-items:center; margin-bottom:14px; font-size:12px; color:var(--muted);}
  .ytotals b{color:var(--text); font-weight:700; font-family:var(--mono);}
  .heatkey{margin-left:auto; display:flex; align-items:center; gap:5px; font-size:10px; color:var(--faint); font-family:var(--mono); text-transform:lowercase; letter-spacing:.08em;}
  .hk{width:11px; height:11px; border-radius:1px;}
  .ymgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px;}
  .ymonth{border:1px solid var(--line); background:var(--panel); border-radius:3px; padding:13px;}
  .ymonth h3{font-size:11px; font-weight:700; text-transform:lowercase; letter-spacing:.16em; margin-bottom:10px; color:var(--muted); font-family:var(--mono);}
  .yweek{display:flex; align-items:center; gap:9px; width:100%; margin-bottom:4px; background:none;}
  .yweek .wcl{width:62px; text-align:left; font-size:10px; color:var(--faint); font-weight:600; font-family:var(--mono);}
  .yweek:hover .wcl{color:var(--cut);}
  .yweek .cells{flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:4px;}
  .hcellheat{height:19px; border-radius:1px; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; font-family:var(--mono); color:#0C1315;}
  .h0{background:var(--sunk);} .h1{background:#1F3A33; color:#7FD3AE;} .h2{background:#2C5C4A; color:#CFF3E2;} .h3{background:#4CC98D;} .h4{background:#8DE9BE;}

  /* ---------- modal ---------- */
  .overlay{position:fixed; inset:0; z-index:40; background:var(--modalveil); display:flex; align-items:center; justify-content:center; padding:18px; backdrop-filter:blur(2px);}
  .modal{width:100%; max-width:560px; max-height:90vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line2); border-radius:3px; box-shadow:0 30px 80px rgba(0,0,0,.7);}
  .mhead{padding:14px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; font-weight:600; font-size:15px; text-transform:lowercase; letter-spacing:-.01em;}
  .pmchip{font-size:10px; font-weight:800; padding:3px 11px; border-radius:2px; color:#fff; font-family:var(--mono); text-transform:lowercase; letter-spacing:.06em;}
  .mbody{padding:22px; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field label{display:block; font-size:9px; text-transform:lowercase; letter-spacing:.16em; color:var(--faint); font-weight:700; margin-bottom:5px; font-family:var(--mono);}
  .full{grid-column:1 / -1;}
  .maprow{display:flex; gap:6px;}
  .mapbtn{flex-shrink:0; display:flex; align-items:center; padding:0 13px; background:var(--sunk); border:1px solid var(--line2); border-radius:2px; font-size:11px; font-weight:700; text-decoration:none; font-family:var(--mono);}
  .mapbtn:hover{border-color:var(--cut); color:var(--cut);}
  .btnrow{display:flex; gap:7px;}
  .btnrow button{flex:1; padding:9px 0; border-radius:2px; font-weight:700; font-size:11px; background:var(--sunk); border:1px solid var(--line2); color:var(--muted); text-transform:lowercase; letter-spacing:.04em;}
  .btnrow button:hover{color:var(--text); border-color:var(--muted);}
  .btnrow button.on{background:var(--steel); border-color:var(--steel); color:var(--steel-ink);}
  .btnrow.pms button.on.mak{background:#4C9BE8; border-color:#4C9BE8; color:#06131F;}
  .btnrow.pms button.on.chris{background:#E8B04C; border-color:#E8B04C; color:#1F1503;}
  .btnrow.pms button.on.michael{background:#E86A6A; border-color:#E86A6A; color:#1F0606;}
  .btnrow.pms button.on.adam{background:#4CC98D; border-color:#4CC98D; color:#04170E;}
  .checkrow{display:flex; align-items:center; gap:9px; font-size:12px; font-weight:600; padding:7px 0;}
  .checkrow input{width:15px; height:15px; accent-color:var(--cut);}
  textarea{height:74px; resize:none;}
  .mfoot{padding:14px 22px; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px;}
  .del{color:#E86A6A; font-size:12px; font-weight:700; padding:9px 13px; border-radius:2px; text-transform:lowercase; letter-spacing:.04em;}
  .del:hover{background:rgba(232,106,106,.12);}
  .mfoot .grow{flex:1;}
  .btn{padding:9px 17px; border-radius:2px; font-size:12px; font-weight:700; background:transparent; border:1px solid var(--line2); color:var(--muted); text-transform:lowercase; letter-spacing:.05em;}
  .btn:hover{background:var(--sunk); color:var(--text);}
  .btn.primary{background:var(--steel); color:var(--steel-ink); border-color:var(--steel);}
  .btn.primary:hover{filter:brightness(1.15);}
  .btn.ghost{color:var(--cut); border-color:rgba(255,106,43,.4);}
  .btn.ghost:hover{background:var(--cut-dim); color:var(--cut);}
  .crewrow{display:grid; grid-template-columns:1fr 2fr; gap:8px; margin-bottom:8px;}
  .note{font-size:11px; color:var(--faint); margin-bottom:13px; line-height:1.5;}
  .dimmed{opacity:.35; pointer-events:none;}

  /* ---------- day-crew editor ---------- */
  .rosterhead{font-size:9px; font-weight:700; text-transform:lowercase; letter-spacing:.16em; color:var(--faint); font-family:var(--mono); padding:14px 0 5px; border-bottom:1px solid var(--line2);}
  .rosterhead:first-of-type{padding-top:2px;}
  .fitterrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
  .fitterrow:last-child{border-bottom:none;}
  .fname{width:78px; font-weight:600; font-size:12px;}
  .assignseg{flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:4px;}
  .assignseg button{padding:6px 0; border-radius:2px; font-size:10px; font-weight:700; background:var(--sunk); border:1px solid var(--line2); color:var(--faint); text-transform:lowercase; font-family:var(--mono);}
  .assignseg button:hover{border-color:var(--muted); color:var(--text);}
  .assignseg button.on{background:var(--steel); border-color:var(--steel); color:var(--steel-ink);}
  .assignseg button.on.hol{background:#4C9BE8; border-color:#4C9BE8; color:#06131F;}
  .assignseg button.on.off{background:#3C4E53; border-color:#3C4E53; color:var(--text);}
  .vansum{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px;}
  .vansum .v{background:var(--sunk); border:1px solid var(--line); border-radius:2px; padding:9px; text-align:center;}
  .vansum .v b{display:block; font-size:10px; text-transform:lowercase; letter-spacing:.12em; margin-bottom:3px; color:var(--faint); font-family:var(--mono);}
  .vansum .v span{font-size:11px; color:var(--muted);}
  .vansum .v.warnv{border-color:var(--cut);} .vansum .v.warnv span{color:var(--cut);}
  .vansum .v.badv{border-color:#E86A6A;} .vansum .v.badv span{color:#E86A6A;}

  /* ---------- logo variants ---------- */
  .brand img{height:26px; width:auto; display:block;}
  .logo-light{display:none;}
  body.light .logo-dark{display:none;}
  body.light .logo-light{display:block;}

  /* PM colours, light mode — same identities, paper-friendly */
  body.light .pm-mak{background:#DCEAF9; border-color:#2F7FD1; color:#0B2440;}
  body.light .pm-chris{background:#FBF0D5; border-color:#D69713; color:#3D2A03;}
  body.light .pm-michael{background:#FBDFDF; border-color:#D64545; color:#3F0E0E;}
  body.light .pm-adam{background:#D8F3E5; border-color:#199C63; color:#06301F;}
  body.light .sw-mak{background:#2F7FD1;} body.light .sw-chris{background:#D69713;}
  body.light .sw-michael{background:#D64545;} body.light .sw-adam{background:#199C63;}
  body.light .h1{background:#CDEBDC; color:#0E5537;} body.light .h2{background:#8FD8B8; color:#06301F;}

<script>
/* =========================================================
   Onesign & Digital — Fitting Board (standalone, no install)
   v1.2 — PM colours, all-day span, OOH, backlog, drag fixes
   ========================================================= */

const PMS = {
  chris:   { name:"Chris" },
  adam:    { name:"Adam" },
  michael: { name:"Michael" },
  mak:     { name:"Mak" },
};
const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

/* ---------- date helpers ---------- */
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const fromISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtWC = d => d.getDate() + " " + MONTHS[d.getMonth()].slice(0,3);
const fmtLong = d => d.getDate() + " " + MONTHS[d.getMonth()].slice(0,3) + " " + d.getFullYear();
const mondaysTouching = (y,m) => { const out=[]; let mo=mondayOf(new Date(y,m,1)); const end=new Date(y,m+1,0); while(mo<=end){out.push(new Date(mo)); mo=addDays(mo,7);} return out; };
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const splitCrew = s => String(s||"").split(/\s*&\s*|\s*,\s*/).map(x=>x.trim()).filter(Boolean);

/* ---------- persistence + migration ---------- */
const KEY = "onesign-fitting-board-v4";   // v4: rebuilt from the real whiteboard - old demo data intentionally cleared
const OLDKEYS = [];   // no migration - fresh board from the photos
const STATUS_TO_PM = { confirmed:"adam", pencilled:"chris", survey:"mak", urgent:"michael", complete:"adam" };
function migrateJobs(oldJobs){
  return (oldJobs||[]).map(j => {
    const nj = Object.assign({}, j);
    if (!nj.pm){ nj.pm = STATUS_TO_PM[nj.status] || "mak"; nj.done = nj.status==="complete"; delete nj.status; }
    if (nj.done===undefined) nj.done = false;
    if (nj.wc===undefined) nj.wc = "";
    if (nj.lane===undefined) nj.lane = "";
    return nj;
  });
}
function loadData(){
  try {
    const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw);
    for (const ok of OLDKEYS){
      const old = localStorage.getItem(ok);
      if (old){
        const d = JSON.parse(old);
        return { vans:d.vans, jobs:migrateJobs(d.jobs), fitters:d.fitters||deriveFitters(d.vans), dayCrews:d.dayCrews||{}, prefs:{showWeekends:false} };
      }
    }
  } catch(e) {}
  return null;
}
function deriveFitters(vs){ const out=[]; (vs||[]).forEach(v=>splitCrew(v.crew).forEach(n=>{ if(!out.includes(n)) out.push(n); })); return out; }
function saveData(){
  try { localStorage.setItem(KEY, JSON.stringify({vans, jobs, fitters, extras, dayCrews, prefs})); document.getElementById("saved").textContent = "Saved " + new Date().toLocaleTimeString(); } catch(e) {}
}

/* ---------- crew logic ---------- */
const allPeople = () => [...fitters, ...extras];
function defaultAssign(){
  const a = {};
  allPeople().forEach(f => a[f] = "off");
  vans.forEach((v,i) => splitCrew(v.crew).forEach(n => { a[n] = i; }));
  return a;
}
function assignFor(dateIso){
  const a = defaultAssign();
  const ov = dayCrews[dateIso];
  if (ov) Object.keys(ov).forEach(k => { a[k] = ov[k]; });
  return { assign:a, override:!!ov };
}
function crewsFor(dateIso){
  const { assign, override } = assignFor(dateIso);
  const crews = vans.map(()=>[]);
  const holiday = [];
  Object.keys(assign).forEach(f => {
    if (assign[f]==="hol") holiday.push(f);
    else if (typeof assign[f]==="number" && crews[assign[f]]) crews[assign[f]].push(f);
  });
  return { crews, holiday, override };
}

/* ---------- drag & drop (fixed) ---------- */
let dragId = null;
let justDragged = false;

function dragStart(ev, id){
  if (tv){ ev.preventDefault(); return; }
  dragId = id;
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", id); } catch(e){}
  ev.target.classList.add("dragsrc");
  requestAnimationFrame(() => document.body.classList.add("dragging"));
}
function cleanupDrag(){
  document.body.classList.remove("dragging");
  document.querySelectorAll(".dragsrc").forEach(el=>el.classList.remove("dragsrc"));
  document.querySelectorAll(".dragover").forEach(el=>el.classList.remove("dragover"));
  dragId = null;
}
/* Global cleanup — fires even when the dragged element was re-rendered
   away mid-drag (this was the cause of the "can only drag once" bug). */
document.addEventListener("dragend", cleanupDrag);
document.addEventListener("drop", () => setTimeout(cleanupDrag, 0));

function allowDrop(ev){ ev.preventDefault(); ev.dataTransfer.dropEffect="move"; ev.currentTarget.classList.add("dragover"); }
function dragLeave(ev){ ev.currentTarget.classList.remove("dragover"); }
function doDrop(ev, wcIso, day, van, slot){
  ev.preventDefault(); ev.stopPropagation();
  let id = dragId; try { id = id || ev.dataTransfer.getData("text/plain"); } catch(e){}
  const j = byId(id);
  cleanupDrag();
  justDragged = true; setTimeout(()=>{ justDragged=false; }, 150);
  if (!j) return;
  j.wc = wcIso; j.day = day; j.van = van; j.lane = "";
  if (slot) j.slot = slot;              // null = keep existing slot (month view / backlog restore)
  if (wcIso==="" ){ /* moved to backlog */ }
  saveData(); render();
}
function dropHolding(ev, lane){
  ev.preventDefault(); ev.stopPropagation();
  let id = dragId; try { id = id || ev.dataTransfer.getData("text/plain"); } catch(e){}
  const j = byId(id);
  cleanupDrag();
  justDragged = true; setTimeout(()=>{ justDragged=false; }, 150);
  if (!j) return;
  j.wc = ""; j.lane = lane;
  saveData(); render();
}
const dz = (wcIso, day, van, slot) =>
  `ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="doDrop(event,'${wcIso}',${day},${van},${slot?("'"+slot+"'"):"null"})"`;

/* ---------- rendering ---------- */
function render(){
  document.getElementById("viewSeg").innerHTML = ["week","month","year"].map(v =>
    `<button class="${v===view?'on':''}" onclick="setView('${v}')">${v}</button>`).join("");
  document.getElementById("title").textContent =
    view==="week" ? "week commencing " + fmtLong(wc)
    : view==="month" ? MONTHS[monthCursor.m] + " " + monthCursor.y
    : String(yearCursor);
  const wb = document.getElementById("wkendBtn");
  wb.classList.toggle("on", prefs.showWeekends);
  wb.style.display = view==="year" ? "none" : "";
  document.getElementById("legend").innerHTML =
    Object.keys(PMS).map(k => `<span class="l"><span class="swatch sw-${k}"></span>${PMS[k].name}</span>`).join("") +
    `<span class="l" style="font-weight:400;">✓ = fitted (jobs stay on as a record)</span>` +
    (view==="week" && !tv ? `<span class="draghint">Drag cards between days, vans, AM/PM — or into the backlog</span>` : "") +
    `<span class="end">Data saves to this PC · the developer build will sync live for everyone</span>`;
  const main = document.getElementById("main");
  if (view==="week") main.innerHTML = weekView();
  if (view==="month") main.innerHTML = monthView();
  if (view==="year") main.innerHTML = yearView();
}

function cardHTML(j, opts){
  opts = opts || {};
  const pm = PMS[j.pm] ? j.pm : "mak";
  const drag = `draggable="${tv?'false':'true'}" ondragstart="dragStart(event,'${j.id}')"`;
  if (opts.compact){
    return `<button class="chip pm-${pm} ${j.done?'done':''}" ${drag} title="${esc(j.customer)} · ${esc(j.quoteRef)} · PM: ${PMS[pm].name}" onclick="openJob('${j.id}')">${j.done?"✓ ":""}${esc(j.customer)||"Untitled"}</button>`;
  }
  const meta = [j.quoteRef, [j.location, j.postcode].filter(Boolean).join(", ")].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("");
  const extra = [j.crew && ("Crew: "+j.crew), j.access].filter(Boolean).join(" · ");
  return `<button class="card pm-${pm} ${j.done?'done':''} ${opts.allday?'allday':''}" ${drag} title="PM: ${PMS[pm].name}" onclick="openJob('${j.id}')">
    ${opts.allday ? `<span class="alldaytag">All day</span>` : ""}
    <div class="top"><span class="name">${esc(j.customer)||"Untitled job"}</span>${j.done?`<span class="fitted">✓ Fitted</span>`:""}</div>
    ${meta ? `<div class="meta">${meta}</div>` : ""}
    ${extra ? `<div class="extra">${esc(extra)}</div>` : ""}
  </button>`;
}

function weekDays(){
  const wcIso = iso(wc);
  const days = [0,1,2,3,4];
  [5,6].forEach(d => {
    if (prefs.showWeekends || jobs.some(j => j.wc===wcIso && j.day===d)) days.push(d);
  });
  return days;
}

function weekView(){
  const wcIso = iso(wc), today = iso(new Date());
  const days = weekDays();
  let h = `<div class="weekwrap"><div class="boardcol">`;
  h += `<div class="grid" style="grid-template-columns:${tv?'160px':'125px'} repeat(3,1fr)">`;
  h += `<div class="hcell"></div>`;
  vans.forEach(v => h += `<div class="hcell"><div class="van">${esc(v.name)}</div><div class="crew">${esc(v.crew)}</div></div>`);
  days.forEach(d => {
    const dName = DAY_NAMES[d];
    const dt = addDays(wc, d), dateIso = iso(dt), isToday = dateIso===today, wkend = d>=5;
    const { crews, holiday, override } = crewsFor(dateIso);
    h += `<div class="dcell ${isToday?'today':''} ${wkend?'wkend':''}">
      <div class="dname">${dName}</div><div class="ddate">${fmtWC(dt)}</div>
      ${override ? `<span class="daytag">Crew change</span>` : ""}
      ${holiday.length ? `<span class="holtag">On holiday: ${esc(holiday.join(", "))}</span>` : ""}
      <button class="crewbtn" onclick="openDayCrew('${dateIso}')">${override ? "Edit crews" : "Change crews"}</button>
    </div>`;
    for (let van=0; van<vans.length; van++){
      const cell = jobsFor(wcIso, d, van);
      const dayJ = cell.filter(j=>j.slot==="DAY"), am = cell.filter(j=>j.slot==="AM"), pm = cell.filter(j=>j.slot==="PM"), ooh = cell.filter(j=>j.slot==="OOH");
      let badge = "";
      if (override){
        const c = crews[van];
        if (c.length===0) badge = `<span class="crewbadge bad">⚠ No crew</span>`;
        else if (c.length===1) badge = `<span class="crewbadge">⚠ ${esc(c[0])} only</span>`;
        else badge = `<span class="crewbadge">${esc(c.join(" & "))}</span>`;
      }
      const hasDay = dayJ.length > 0, hasSlotJob = (am.length + pm.length) > 0;
      h += `<div class="cell ${wkend?'wkend':''}">${badge}`;
      h += `<div class="cellsplit">`;
      /* All-day jobs sit across the FULL width of the cell, covering AM+PM */
      h += `<div class="dayrow ${hasDay?'show':''}" ${dz(wcIso,d,van,"DAY")}>`;
      dayJ.forEach(j => h += cardHTML(j, {allday:true}));
      if (!hasDay) h += `<div class="daydrop">drop here for all day</div>`;
      h += `</div>`;
      /* AM / PM rows — hidden when an all-day job covers the whole cell,
         but revealed again while dragging so they stay droppable */
      h += `<div class="ampmcol ${(hasDay && !hasSlotJob)?'hidden':''}">`;
      [["AM",am],["PM",pm]].forEach(([lab, arr]) => {
        h += `<div class="slot"><span class="slotlabel">${lab}</span><div class="slotjobs" ${dz(wcIso,d,van,lab)}>`;
        arr.forEach(j => h += cardHTML(j));
        h += `<button class="addbtn" onclick="openNew('${wcIso}',${d},${van},'${lab}')">+ job</button></div></div>`;
      });
      h += `</div>`;
      if (hasDay && !hasSlotJob){
        h += `<div class="slimadd"><button onclick="openNew('${wcIso}',${d},${van},'AM')">+ am job</button><button onclick="openNew('${wcIso}',${d},${van},'PM')">+ pm job</button></div>`;
      }
      /* OOH row — only shows when needed (or while dragging as a target) */
      h += `<div class="slot oohrow ${ooh.length?'show':''}"><span class="slotlabel ooh">OOH</span><div class="slotjobs" ${dz(wcIso,d,van,"OOH")}>`;
      ooh.forEach(j => h += cardHTML(j));
      if (!ooh.length) h += `<button class="addbtn" onclick="openNew('${wcIso}',${d},${van},'OOH')">+ out of hours</button>`;
      else h += `<button class="addbtn" onclick="openNew('${wcIso}',${d},${van},'OOH')">+ job</button>`;
      h += `</div></div>`;
      h += `</div></div>`;
    }
  });
  h += `</div></div>`;
  /* ---- right-hand holding panels: to be scheduled + to be delivered ---- */
  h += `<aside class="sidebar">`;
  h += holdingPanel({
    lane: "",
    title: "to be scheduled",
    jobs: backlog(),
    empty: "Nothing waiting — drag a job here to unschedule it",
    note: 'Jobs quoted in ClarityGo land here first, then drag them onto the board when dates are confirmed.',
    importBtn: true
  });
  h += holdingPanel({
    lane: "delivery",
    title: "to be delivered",
    jobs: delivery(),
    empty: "Nothing to deliver — drag a job here when it only needs dropping to site",
    note: 'Items going to site without a fitting team. Drag onto the board if a van ends up running it.',
    importBtn: false
  });
  h += `</aside>`;
  return h + `</div>`;
}

function holdingPanel(o){
  let h = `<section class="holding">
    <div class="bhead"><b>${o.title}</b><span class="cnt">${o.jobs.length}</span></div>
    <div class="backloglist" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropHolding(event,'${o.lane}')">`;
  o.jobs.forEach(j => h += cardHTML(j));
  if (!o.jobs.length) h += `<div class="bempty">${o.empty}</div>`;
  h += `</div>
    <div class="bactions">
      <button onclick="openNewHolding('${o.lane}')">+ add job</button>
      ${o.importBtn ? `<button onclick="openImport()">import from clarity</button>` : ``}
    </div>
    <div class="bnote">${o.note}</div>
  </section>`;
  return h;
}

function monthView(){
  const mondays = mondaysTouching(monthCursor.y, monthCursor.m);
  const wcIsos = mondays.map(m=>iso(m));
  const dayRows = [0,1,2,3,4];
  [5,6].forEach(d => {
    if (prefs.showWeekends || jobs.some(j => wcIsos.includes(j.wc) && j.day===d)) dayRows.push(d);
  });
  let h = `<div class="mwrap"><div class="grid mgrid" style="grid-template-columns:105px repeat(${mondays.length},1fr)">`;
  h += `<div class="hcell" style="display:flex;align-items:flex-end;"><span style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);font-weight:700;">Days</span></div>`;
  mondays.forEach(m => {
    h += `<div class="wchead"><button class="wc" onclick="jumpWeek('${iso(m)}')">W/C ${fmtWC(m)}</button><div class="subvans">` +
      vans.map(v=>`<span>${esc(v.name.replace("Van ","V"))}</span>`).join("") + `</div></div>`;
  });
  dayRows.forEach(d => {
    const dName = DAY_NAMES[d];
    h += `<div class="dcell ${d>=5?'wkend':''}"><div class="dname" style="font-size:12px;">${dName}</div></div>`;
    mondays.forEach(m => {
      const wcIso = iso(m), inMonth = addDays(m,d).getMonth()===monthCursor.m;
      h += `<div class="mcell ${inMonth?'':'out'}"><div class="tri">`;
      for (let van=0; van<vans.length; van++){
        h += `<div class="vslot" ${dz(wcIso,d,van,null)}>` + jobsFor(wcIso,d,van).map(j=>cardHTML(j,{compact:true})).join("") + `</div>`;
      }
      h += `</div></div>`;
    });
  });
  return h + `</div></div>`;
}

function yearView(){
  const heat = n => n===0?"h0" : n<=1?"h1" : n<=2?"h2" : n<=4?"h3" : "h4";
  const countFor = (wcIso, van) => jobs.filter(j=>j.wc===wcIso && j.van===van && !j.done).length;
  let h = `<div class="ytotals">`;
  vans.forEach((v,i) => {
    const total = jobs.filter(j=>j.wc && j.wc.slice(0,4)===String(yearCursor) && j.van===i).length;
    h += `<span>${esc(v.name)} <span style="color:var(--faint)">(${esc(v.crew)})</span> — <b>${total} jobs in ${yearCursor}</b></span>`;
  });
  h += `<span class="heatkey">Quiet <span class="hk h0"></span><span class="hk h1"></span><span class="hk h2"></span><span class="hk h3"></span><span class="hk h4"></span> Busy</span></div>`;
  h += `<div class="ymgrid">`;
  MONTHS.forEach((mName, m) => {
    const mondays = mondaysTouching(yearCursor, m).filter(d => d.getMonth()===m || addDays(d,6).getMonth()===m);
    h += `<div class="ymonth"><h3>${mName}</h3>`;
    mondays.forEach(mon => {
      const wcIso = iso(mon);
      h += `<button class="yweek" onclick="jumpWeek('${wcIso}')"><span class="wcl">W/C ${fmtWC(mon)}</span><span class="cells">`;
      for (let van=0; van<vans.length; van++){
        const n = countFor(wcIso, van);
        h += `<span class="hcellheat ${heat(n)}" title="${esc(laneName(van))}: ${n} live job${n===1?'':'s'}">${n>0?n:""}</span>`;
      }
      h += `</span></button>`;
    });
    h += `</div>`;
  });
  return h + `</div>`;
}

/* ---------- job modal ---------- */
let editing = null;

function openNew(wcIso, day, van, slot){
  editing = {id:null, customer:"", quoteRef:"", location:"", postcode:"", wc:wcIso, lane:"", day, van, slot:slot||"AM", pm:"chris", done:false, crew:"", access:"", notes:""};
  drawJobModal("Add job");
}
function openNewHolding(lane){
  editing = {id:null, customer:"", quoteRef:"", location:"", postcode:"", wc:"", lane:lane||"", day:0, van:0, slot:"AM", pm:"chris", done:false, crew:"", access:"", notes:""};
  drawJobModal(lane==="delivery" ? "Add delivery" : "Add job");
}
function openJob(id){
  if (justDragged) return;
  const j = byId(id); if (!j) return;
  editing = JSON.parse(JSON.stringify(j));
  editing._lastWc = editing.wc || iso(mondayOf(new Date()));
  drawJobModal("Job details");
}
function f(k, v){ editing[k] = v; drawJobModal(editing.id ? "Job details" : "Add job", true); }
function fWc(v){ if (v){ editing.wc = iso(mondayOf(fromISO(v))); editing._lastWc = editing.wc; } }
function fBacklog(chk){
  if (chk){ editing._lastWc = editing.wc || iso(mondayOf(new Date())); editing.wc = ""; }
  else { editing.wc = editing._lastWc || iso(mondayOf(new Date())); }
  drawJobModal(editing.id ? "Job details" : "Add job", true);
}

function drawJobModal(title, keepScroll){
  const j = editing, pm = PMS[j.pm] ? j.pm : "mak";
  const inBacklog = !j.wc;
  const mapQ = [j.location, j.postcode].filter(Boolean).join(", ");
  const mapBtn = mapQ ? `<a class="mapbtn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapQ)}">Map ↗</a>` : "";
  const slotBtn = (v,l) => `<button class="${j.slot===v?'on':''}" onclick="f('slot','${v}')">${l}</button>`;
  const pmBtn = k => `<button class="${j.pm===k?('on '+k):''}" onclick="f('pm','${k}')">${PMS[k].name}</button>`;
  const pmColors = {mak:"#3b82f6", chris:"#f59e0b", michael:"#ef4444", adam:"#10b981"};
  const root = document.getElementById("modalRoot");
  const prevScroll = keepScroll && root.querySelector(".modal") ? root.querySelector(".modal").scrollTop : 0;
  root.innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="mhead"><span>${title}</span><span class="pmchip" style="background:${pmColors[pm]}">${PMS[pm].name}</span></div>
      <div class="mbody">
        <div class="field full"><label>Customer / job name *</label><input id="fCustomer" value="${esc(j.customer)}" oninput="editing.customer=this.value" placeholder="e.g. Vertu Motors Arena"></div>
        <div class="field full"><label>Project manager (sets the colour)</label><div class="btnrow pms">${Object.keys(PMS).map(pmBtn).join("")}</div></div>
        <div class="field"><label>Quote reference</label><input value="${esc(j.quoteRef)}" oninput="editing.quoteRef=this.value" placeholder="Q-0000 (from ClarityGo)"></div>
        <div class="field" style="display:flex;align-items:flex-end;"><label class="checkrow" style="margin:0;"><input type="checkbox" ${j.done?"checked":""} onchange="editing.done=this.checked"> Fitted / completed ✓</label></div>
        <div class="field"><label>Location</label><input value="${esc(j.location)}" onchange="f('location',this.value)" placeholder="Town / site"></div>
        <div class="field"><label>Postcode</label><div class="maprow"><input value="${esc(j.postcode)}" onchange="f('postcode',this.value)" placeholder="NE11 0TU">${mapBtn}</div></div>
        <div class="field full"><label class="checkrow" style="margin:0;"><input type="checkbox" ${inBacklog?"checked":""} onchange="fBacklog(this.checked)"> No date yet — keep in a holding list</label>
          ${inBacklog ? `<div class="btnrow" style="margin-top:8px;">
            <button class="${j.lane!=="delivery"?'on':''}" onclick="f('lane','')">to be scheduled</button>
            <button class="${j.lane==="delivery"?'on':''}" onclick="f('lane','delivery')">to be delivered</button>
          </div>` : ``}</div>
        <div class="field ${inBacklog?'dimmed':''}"><label>Van</label><select onchange="editing.van=Number(this.value)">${vans.map((v,i)=>`<option value="${i}" ${i===j.van?'selected':''}>${esc(v.name)} — ${esc(v.crew)}</option>`).join("")}</select></div>
        <div class="field ${inBacklog?'dimmed':''}"><label>Crew override (optional)</label><input value="${esc(j.crew)}" oninput="editing.crew=this.value" placeholder="e.g. Paul & Lewis today"></div>
        <div class="field ${inBacklog?'dimmed':''}"><label>Week commencing</label><input type="date" value="${j.wc}" onchange="fWc(this.value)"></div>
        <div class="field ${inBacklog?'dimmed':''}"><label>Day</label><select onchange="editing.day=Number(this.value)">${DAY_NAMES.map((d,i)=>`<option value="${i}" ${i===j.day?'selected':''}>${d}</option>`).join("")}</select></div>
        <div class="field full ${inBacklog?'dimmed':''}"><label>Time slot</label><div class="btnrow">${slotBtn("AM","Morning")}${slotBtn("PM","Afternoon")}${slotBtn("DAY","All day")}${slotBtn("OOH","Out of hours")}</div></div>
        <div class="field full"><label>Access / equipment</label><input value="${esc(j.access)}" oninput="editing.access=this.value" placeholder="e.g. Cherry picker booked, sign in at reception"></div>
        <div class="field full"><label>Notes</label><textarea oninput="editing.notes=this.value" placeholder="Anything the fitters need to know">${esc(j.notes)}</textarea></div>
      </div>
      <div class="mfoot">
        ${j.id ? `<button class="del" onclick="deleteJob()">Delete</button>` : ""}
        <span class="grow"></span>
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="saveJob()">${j.id ? "Save changes" : "Add job"}</button>
      </div>
    </div>
  </div>`;
  if (prevScroll) root.querySelector(".modal").scrollTop = prevScroll;
}

function saveJob(){
  if (!editing.customer.trim()){ document.getElementById("fCustomer").focus(); return; }
  delete editing._lastWc;
  if (editing.id){ jobs = jobs.map(j => j.id===editing.id ? editing : j); }
  else { editing.id = "j-" + Date.now() + "-" + Math.floor(Math.random()*999); jobs.push(editing); }
  saveData(); closeModal(); render();
}
function deleteJob(){ jobs = jobs.filter(j => j.id!==editing.id); saveData(); closeModal(); render(); }
function closeModal(){ editing=null; dcEditing=null; document.getElementById("modalRoot").innerHTML=""; }

/* ---------- Clarity import (workaround demo) ---------- */
function openImport(){
  document.getElementById("modalRoot").innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" style="max-width:520px;">
      <div class="mhead">Import jobs from ClarityGo</div>
      <div style="padding:20px;">
        <p class="note">ClarityGo has no public scheduling API, so this uses its report/CSV export as the bridge. Export your confirmed quotes from Clarity, then paste the rows below — one job per line:</p>
        <p class="note" style="background:#27272a;border-radius:8px;padding:8px;font-family:monospace;">Customer, Quote ref, Location, Postcode, PM<br>Bar Blanc, Q-2255, Durham, DH1 3SE, Chris</p>
        <textarea id="csvBox" style="height:130px;" placeholder="Paste CSV rows here…"></textarea>
        <p class="note" style="margin-top:8px;">Rows are added to "To be scheduled". Quote refs already on the board are skipped so nothing duplicates. PM matches by name (Mak / Chris / Michael / Adam).</p>
      </div>
      <div class="mfoot"><span class="grow"></span>
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="runImport()">Import</button>
      </div>
    </div>
  </div>`;
}
function runImport(){
  const text = document.getElementById("csvBox").value.trim();
  if (!text){ closeModal(); return; }
  const existingRefs = jobs.map(j => (j.quoteRef||"").toLowerCase()).filter(Boolean);
  const pmByName = {}; Object.keys(PMS).forEach(k => pmByName[PMS[k].name.toLowerCase()] = k);
  let added = 0;
  text.split(/\r?\n/).forEach(line => {
    const parts = line.split(",").map(s=>s.trim());
    if (parts.length < 2 || /^customer/i.test(parts[0])) return;
    const [customer, quoteRef, location, postcode, pmName] = parts;
    if (!customer) return;
    if (quoteRef && existingRefs.includes(quoteRef.toLowerCase())) return;
    jobs.push({ id:"imp-"+Date.now()+"-"+(added++), customer, quoteRef:quoteRef||"", location:location||"", postcode:postcode||"",
      pm: pmByName[(pmName||"").toLowerCase()] || "chris", done:false, wc:"", lane:"", day:0, van:0, slot:"AM", crew:"", access:"", notes:"Imported from ClarityGo" });
  });
  saveData(); closeModal(); render();
}

/* ---------- day-crew editor ---------- */
let dcEditing = null;

function openDayCrew(dateIso){
  dcEditing = { date: dateIso, assign: assignFor(dateIso).assign };
  drawDayCrew();
}
function dcSet(fitter, val){
  dcEditing.assign[fitter] = (val==="hol"||val==="off") ? val : Number(val);
  drawDayCrew();
}
function drawDayCrew(){
  const d = fromISO(dcEditing.date);
  const a = dcEditing.assign;
  const crews = vans.map(()=>[]);
  const hols = [];
  Object.keys(a).forEach(fn => { if (a[fn]==="hol") hols.push(fn); else if (typeof a[fn]==="number") crews[a[fn]].push(fn); });
  const seg = fn => {
    const cur = a[fn];
    let b = vans.map((v,i)=>`<button class="${cur===i?'on':''}" onclick="dcSet('${esc(fn)}',${i})">${esc(v.name.replace("Van ","V"))}</button>`).join("");
    b += `<button class="${cur==='hol'?'on hol':''}" onclick="dcSet('${esc(fn)}','hol')">Holiday</button>`;
    b += `<button class="${cur==='off'?'on off':''}" onclick="dcSet('${esc(fn)}','off')">Off / shop</button>`;
    return b;
  };
  const sum = vans.map((v,i)=>{
    const c = crews[i];
    const cls = c.length===0 ? "badv" : c.length===1 ? "warnv" : "";
    const txt = c.length ? esc(c.join(" & ")) : "⚠ Nobody assigned";
    return `<div class="v ${cls}"><b>${esc(v.name)}</b><span>${txt}${c.length===1?" ⚠":""}</span></div>`;
  }).join("");
  document.getElementById("modalRoot").innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" style="max-width:560px;">
      <div class="mhead">Crews for ${DAY_NAMES[(d.getDay()+6)%7]} ${fmtLong(d)}</div>
      <div style="padding:20px;">
        <p class="note">This changes the crews for <b>this day only</b>. Every other day keeps the default pairings. Holidays show on the board so nothing gets missed.</p>
        <div class="rosterhead">fitting crew</div>
        ${fitters.map(fn=>`<div class="fitterrow"><span class="fname">${esc(fn)}</span><div class="assignseg">${seg(fn)}</div></div>`).join("")}
        <div class="rosterhead">additional bodies</div>
        ${extras.length ? extras.map(fn=>`<div class="fitterrow"><span class="fname">${esc(fn)}</span><div class="assignseg">${seg(fn)}</div></div>`).join("") : `<p class="note" style="margin:6px 0 0;">Nobody listed — add people in "vans &amp; fitters".</p>`}
        <div class="vansum">${sum}</div>
        ${hols.length ? `<p class="note" style="margin-top:10px;">🏖 On holiday: ${esc(hols.join(", "))}</p>` : ""}
      </div>
      <div class="mfoot">
        ${dayCrews[dcEditing.date] ? `<button class="btn ghost" onclick="dcReset()">Reset to default crews</button>` : ""}
        <span class="grow"></span>
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="dcSave()">Save this day</button>
      </div>
    </div>
  </div>`;
}
function dcSave(){
  const def = defaultAssign();
  const same = Object.keys(dcEditing.assign).every(k => dcEditing.assign[k]===def[k]) &&
               Object.keys(def).every(k => dcEditing.assign[k]===def[k]);
  if (same) delete dayCrews[dcEditing.date];
  else dayCrews[dcEditing.date] = dcEditing.assign;
  saveData(); closeModal(); render();
}
function dcReset(){ delete dayCrews[dcEditing.date]; saveData(); closeModal(); render(); }

/* ---------- vans & fitters modal ---------- */
function openCrews(){
  document.getElementById("modalRoot").innerHTML = `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" style="max-width:460px;">
      <div class="mhead">Vans &amp; fitters</div>
      <div style="padding:20px;">
        <p class="note"><b>Default crews</b> — these apply every day unless a specific day has a crew change (set from the week view).</p>
        ${vans.map((v,i)=>`<div class="crewrow"><input id="vn${i}" value="${esc(v.name)}"><input id="vc${i}" value="${esc(v.crew)}" placeholder="e.g. Dave &amp; Lewis"></div>`).join("")}
        <p class="note" style="margin-top:16px;"><b>Fitting crew</b> — the regular fitters, listed in van order (comma-separated).</p>
        <input id="fitterList" value="${esc(fitters.join(", "))}">
        <p class="note" style="margin-top:14px;"><b>Additional bodies</b> — everyone else who can be pulled onto a van when needed.</p>
        <input id="extraList" value="${esc(extras.join(", "))}">
      </div>
      <div class="mfoot"><span class="grow"></span>
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="saveCrews()">Save</button>
      </div>
    </div>
  </div>`;
}
function saveCrews(){
  vans = vans.map((v,i)=>({name:document.getElementById("vn"+i).value, crew:document.getElementById("vc"+i).value}));
  const listed = document.getElementById("fitterList").value.split(",").map(s=>s.trim()).filter(Boolean);
  const listedExtras = document.getElementById("extraList").value.split(",").map(s=>s.trim()).filter(Boolean);
  const fromCrews = deriveFitters(vans);
  fitters = [...new Set([...listed, ...fromCrews])];
  extras  = [...new Set(listedExtras)].filter(n => !fitters.includes(n));
  saveData(); closeModal(); render();
}

document.addEventListener("keydown", e => { if (e.key==="Escape") closeModal(); });

applyTheme();
render();
</script>
