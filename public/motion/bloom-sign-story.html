<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloom Sign Story</title>
<!--
  The story of a sign being made by Onesign, 32s, told with paper characters.
  Review build: scenes 1–3 (0–12s). Scenes 4–7 are timed but not drawn yet.

  Deterministic: drawFrame(t) is a pure function of t. window.renderFrame(t)
  for Remotion. URL params: ?t=6.5 freeze   ?ui=0 hide bar   ?portrait=1
  ?native=1 back the canvas at exactly 1920×1080 / 1080×1920.
-->
<style>
  :root { color-scheme: light; --paper:#f3efe6; --bar:#ebe5d8; --ink:#23282b; --muted:#6d6a62; --teal:#4e7e8c; --line:#d6cfbf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden;
    font: 500 13px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: absolute; inset: 0 0 calc(60px + env(safe-area-inset-bottom, 0px)) 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  body.noui #stage { bottom: 0; padding: 0; }
  body.noui #bar { display: none; }
  canvas { display: block; border-radius: 3px; box-shadow: 0 0 0 1px var(--line), 0 14px 40px rgba(35,40,43,.12); }
  body.noui canvas { border-radius: 0; box-shadow: none; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(60px + env(safe-area-inset-bottom, 0px));
    padding: 0 16px env(safe-area-inset-bottom, 0px); display: flex; align-items: center; gap: 10px;
    background: var(--bar); border-top: 1px solid var(--line); }
  button, select { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink);
    border-radius: 999px; height: 34px; padding: 0 12px; cursor: pointer; flex: none; }
  button:hover, select:hover { background: #fffdf8; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  #play { width: 34px; padding: 0; display: grid; place-items: center; }
  #play svg { width: 12px; height: 12px; fill: currentColor; }
  #track { position: relative; flex: 1; min-width: 80px; height: 34px; display: flex; align-items: center; }
  #rail { position: absolute; left: 6px; right: 6px; height: 6px; border-radius: 3px; border: 1.5px solid var(--ink); overflow: hidden; }
  #rail i { position: absolute; top: 0; bottom: 0; }
  #rail .todo { background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(35,40,43,.18) 4px 6px); }
  #scrub { position: relative; z-index: 1; width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; height: 34px; cursor: pointer; }
  #scrub::-webkit-slider-runnable-track { height: 6px; background: transparent; }
  #scrub::-moz-range-track { height: 6px; background: transparent; }
  #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%; background: var(--teal); border: 1.5px solid var(--ink); }
  #scrub::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--teal); border: 1.5px solid var(--ink); }
  .tick { position: absolute; top: 4px; bottom: 4px; width: 1.5px; background: rgba(35,40,43,.35); pointer-events: none; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 88px; text-align: right; }
  #time b { color: var(--ink); font-weight: 600; }
  @media (max-width: 620px) { #time { display: none; } #scene { max-width: 118px; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar">
  <button id="play" aria-label="Play / pause"></button>
  <select id="scene" aria-label="Jump to scene"></select>
  <div id="track"><div id="rail"></div><input id="scrub" type="range" min="0" max="32" step="0.001" value="0" aria-label="Scrub"></div>
  <div id="time"><b>00.00</b> / 32.00</div>
  <button id="orient" aria-label="Toggle orientation">16:9</button>
</div>
<script>
'use strict';

/* ==========================================================================
   SETTINGS — timings, colours, characters. Tune here.
   ========================================================================== */

const DURATION = 32;
const BUILT_UNTIL = 12;               // review build: scenes 1–3
const FPS = 60;
const BOIL_EVERY = 3;                 // frames per re-seed of the line boil

const SCENES = [
  { id: 1, name: 'Shop front',       t0: 0,  t1: 4  },
  { id: 2, name: 'Into the studio',  t0: 4,  t1: 8  },
  { id: 3, name: 'The peel',         t0: 8,  t1: 12 },
  { id: 4, name: 'The throw',        t0: 12, t1: 16 },
  { id: 5, name: 'Fabrication',      t0: 16, t1: 22 },
  { id: 6, name: 'The van',          t0: 22, t1: 26 },
  { id: 7, name: 'The fit',          t0: 26, t1: 32 },
];

const COLORS = {
  paper:     '#f3efe6',
  paperHi:   '#fbf8f1',               // thought bubble / design sheet
  ink:       '#23282b',
  teal:      '#4e7e8c',
  tealSoft:  '#a8c3ca',
  shade:     'rgba(35,40,43,0.10)',
  // street
  facade:    '#e7dfcf', neighbourL: '#ddd3c1', neighbourR: '#e1d8c7',
  fascia:    '#cdc6b8', glass: '#dde4e1', pavement: '#e8e1d4', road: '#dcd5c8',
  // studio
  wall:      '#f3efe6', floor: '#e6dfd1', desk: '#d9c7a8', bezel: '#3b4246',
  screenOff: '#eceee9', underside: '#e3ddcf', sky: '#dfe9ea',
  // characters — one warm colour each
  customer:  '#e07a5f',
  designer:  '#e9b44c',
  printer:   '#bfc1bf',
};

const INK = { width: 3.4, boil: 1.25 };            // boil amplitude in screen px

const CHARACTERS = {
  customer: { shape: 'pill',   w: 92,  h: 150, legLen: 52, color: COLORS.customer, eyeGap: 26, eyeY: 0.72, eyeR: 5.5 },
  designer: { shape: 'square', w: 136, h: 122, legLen: 40, color: COLORS.designer, eyeGap: 32, eyeY: 0.64, eyeR: 6 },
};

// The hero frame F: the rectangle the BLOOM design lives in, per world.
const HERO = { aspect: 1.6, wordmarkWidth: 1.46 /* in F units, F.w = 2 */ };
const WORLDS = {
  street: { F: { cx: 1130, cy: 430, w: 400 } },
  studio: { F: { cx: 1010, cy: 420, w: 520 } },
};
const PUSH_MAX_W = 3800;             // F width when it fills the frame (covers 9:16 too)
// 9:16 frames a 1080-wide slice of the 1920×1080 stage, centred on the action.
const PORTRAIT_VIEW = { fit: 1.0, cx: 975, cy: 520 };

// Beat times (seconds)
const T = {
  // scene 1
  walkStart: 0.25, walkEnd: 1.75, lookUp: 2.0, tilt: 2.35, blink1: 2.62,
  cloud: [2.55, 2.68, 2.81], bubble: 2.9, scribble: [3.08, 3.95],
  // scene 2
  push: [4.0, 5.35], pull: [5.35, 6.8], morph: [4.3, 6.4],
  clicks: [6.35, 6.8, 7.25], swatch: 7.32,
  // scene 3
  glance: 8.05, judder: [8.4, 9.3], shake: [9.12, 9.62], wind: 9.65, reach: [9.9, 10.25],
  peel: [10.25, 11.3], lift: [11.3, 12.0],
};

/* ==========================================================================
   Easing, springs, hashing — all pure.
   ========================================================================== */

const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp01((t - a) / (b - a));
const E = {
  lin: u => u,
  inOutSine: u => -(Math.cos(Math.PI * u) - 1) / 2,
  inCubic: u => u * u * u,
  outCubic: u => 1 - Math.pow(1 - u, 3),
  inOutCubic: u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2,
  outBack: u => { const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  outBackBig: u => { const c = 2.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  inOutBack: u => { const c = 1.70158 * 1.525; return u < .5 ? (Math.pow(2*u, 2) * ((c + 1) * 2*u - c)) / 2 : (Math.pow(2*u - 2, 2) * ((c + 1) * (u*2 - 2) + c) + 2) / 2; },
};
// Damped spring 0 → 1.
function spring(t, w = 14, z = 0.32) {
  if (t <= 0) return 0;
  const wd = w * Math.sqrt(1 - z*z);
  return 1 - Math.exp(-z*w*t) * (Math.cos(wd*t) + (z*w/wd) * Math.sin(wd*t));
}
// Decaying wobble around 0 (for landings, squash settles).
const settle = (t, w = 16, z = 0.3) => t <= 0 ? 0 : Math.exp(-z*w*t) * Math.sin(w*Math.sqrt(1 - z*z)*t);
// Piecewise keys: [[time, value, ease], ...] — ease shapes the segment arriving at that key.
function keys(t, k) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) {
    const [t0, v0] = k[i-1], [t1, v1, e] = k[i];
    return lerp(v0, v1, (e || E.inOutCubic)((t - t0) / (t1 - t0)));
  }
  return k[k.length - 1][1];
}
function hash(n) {
  let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b);
  x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixHex = (a, b, u) => { const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], u)))})`; };

/* ==========================================================================
   Ink — hand-drawn strokes with a boil that re-seeds every BOIL_EVERY frames.
   ========================================================================== */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let BASE_SCALE = 1;       // device px per stage px (set per frame)
let BOIL = 0;             // boil seed for this frame
let STROKE = 0;           // stroke counter, reset per frame so seeds are stable

const worldScale = () => { const m = ctx.getTransform(); return Math.hypot(m.a, m.b) / BASE_SCALE; };

function boil(pts, amp, closed) {
  const id = STROKE++;
  if (!amp || pts.length < 2) return pts;
  const s = worldScale(), A = amp / s;
  let total = 0; const L = [0];
  for (let i = 1; i < pts.length; i++) { total += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); L.push(total); }
  if (closed) total += Math.hypot(pts[0][0] - pts[pts.length-1][0], pts[0][1] - pts[pts.length-1][1]);
  const k1 = Math.max(2, Math.round(total * s * 0.03 / (2*Math.PI))), k2 = k1 * 2 + 1;
  const ph = [1, 2, 3, 4].map(j => hash(BOIL * 7919 + id * 131 + j) * Math.PI * 2);
  return pts.map((p, i) => {
    const a = (L[i] / (total || 1)) * Math.PI * 2;
    return [p[0] + A * (Math.sin(k1*a + ph[0]) + 0.5*Math.sin(k2*a + ph[1])) / 1.5,
            p[1] + A * (Math.sin(k1*a + ph[2]) + 0.5*Math.sin(k2*a + ph[3])) / 1.5];
  });
}
function trace(P, closed) {
  ctx.beginPath();
  P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  if (closed) ctx.closePath();
}
// sk: the one drawing primitive. o = { closed, fill, stroke, width, amp, alpha }
function sk(pts, o = {}) {
  const P = boil(pts, o.amp === undefined ? INK.boil : o.amp, o.closed);
  trace(P, o.closed);
  const a = ctx.globalAlpha; if (o.alpha !== undefined) ctx.globalAlpha = a * o.alpha;
  if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
  if (o.stroke !== false) {
    ctx.strokeStyle = o.stroke || COLORS.ink; ctx.lineWidth = o.width || INK.width;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  }
  ctx.globalAlpha = a;
}
// Shape point generators (subdivided so the boil has something to move).
function seg(a, b, step = 22) {
  const n = Math.max(1, Math.ceil(Math.hypot(b[0]-a[0], b[1]-a[1]) / step)), out = [];
  for (let i = 0; i <= n; i++) out.push([lerp(a[0], b[0], i/n), lerp(a[1], b[1], i/n)]);
  return out;
}
function poly(corners, closed = true, step = 22) {
  const out = [];
  const n = corners.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) { const s = seg(corners[i], corners[(i + 1) % n], step); out.push(...s.slice(0, -1)); }
  if (!closed) out.push(corners[n - 1]);
  return out;
}
const rect = (x, y, w, h) => poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]]);
function rrect(x, y, w, h, r, step = 22) {
  r = Math.min(r, w/2, h/2);
  const out = [], arc = (cx, cy, a0) => { for (let i = 0; i <= 6; i++) { const a = a0 + i/6 * Math.PI/2; out.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]); } };
  out.push(...seg([x + r, y], [x + w - r, y], step).slice(0, -1)); arc(x + w - r, y + r, -Math.PI/2);
  out.push(...seg([x + w, y + r], [x + w, y + h - r], step).slice(1, -1)); arc(x + w - r, y + h - r, 0);
  out.push(...seg([x + w - r, y + h], [x + r, y + h], step).slice(1, -1)); arc(x + r, y + h - r, Math.PI/2);
  out.push(...seg([x, y + h - r], [x, y + r], step).slice(1, -1)); arc(x + r, y + r, Math.PI);
  return out;
}
function ellipse(cx, cy, rx, ry, n = 32) {
  const out = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; out.push([cx + rx*Math.cos(a), cy + ry*Math.sin(a)]); }
  return out;
}
const circle = (cx, cy, r) => ellipse(cx, cy, r, r, Math.max(14, Math.round(r * 0.8)));
function dot(x, y, r, color = COLORS.ink) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill(); }

/* ==========================================================================
   Characters — geometric body, dot eyes, stick legs and arms.
   state: x, y (ground), sx, sy (squash), rot (tilt about the feet),
          look [x,y] in -1..1, blink 0..1, legs {mode, phase, amt},
          hands [[x,y]|null, [x,y]|null] world targets (left, right), dir ±1
   ========================================================================== */

function charFrame(spec, st) {
  const sit = st.legs && st.legs.mode === 'sit';
  const bob = st.legs && st.legs.mode === 'walk' ? Math.abs(Math.sin(st.legs.phase)) * 5 * st.legs.amt : 0;
  const bx = st.x, by = sit ? st.y : st.y - spec.legLen - bob;
  const c = Math.cos(st.rot || 0), s = Math.sin(st.rot || 0), sx = st.sx || 1, sy = st.sy || 1;
  const L2W = (lx, ly) => [bx + lx*sx*c - ly*sy*s, by + lx*sx*s + ly*sy*c];
  return { bx, by, L2W, sx, sy };
}

function drawCharacter(spec, st) {
  const f = charFrame(spec, st), { L2W } = f, w = spec.w, h = spec.h, dir = st.dir || 1;

  // legs
  const legs = st.legs || { mode: 'stand' };
  for (const side of [-1, 1]) {
    const hip = L2W(side * w * 0.2, -2);
    let foot;
    if (legs.mode === 'walk') {
      const ph = legs.phase + (side > 0 ? Math.PI : 0);
      foot = [hip[0] + Math.sin(ph) * 20 * legs.amt, st.y - Math.max(0, Math.cos(ph)) * 10 * legs.amt];
    } else if (legs.mode === 'sit') {
      const sw = Math.sin(st.t * 2.6 + side * 1.3) * 5;
      foot = [hip[0] + sw + side * 4, hip[1] + spec.legLen];
    } else {
      foot = [hip[0] + side * 6, st.y];
    }
    sk([hip, foot], { width: 3.4 });
    sk([foot, [foot[0] + dir * 11, foot[1]]], { width: 3.4 });
  }

  // arms behind the body when hanging, drawn after for reaching hands
  const shoulders = [L2W(-w * 0.5, -h * 0.46), L2W(w * 0.5, -h * 0.46)];
  const handPos = [0, 1].map(i => st.hands && st.hands[i] ? st.hands[i]
    : [shoulders[i][0] + (i ? 10 : -10) + Math.sin((st.legs && st.legs.phase || 0) + i*Math.PI) * 12 * ((st.legs && st.legs.amt) || 0),
       shoulders[i][1] + h * 0.34]);

  // body
  let body;
  if (spec.shape === 'pill') body = rrect(-w/2, -h, w, h, w/2, 20);
  else body = rrect(-w/2, -h, w, h, 20, 20);
  sk(body.map(p => L2W(p[0], p[1])), { closed: true, fill: spec.color, width: 3.6 });

  // eyes (dots, with look + blink)
  const lx = (st.look ? st.look[0] : 0) * 9, ly = (st.look ? st.look[1] : 0) * 8;
  for (const side of [-1, 1]) {
    const e = L2W(side * spec.eyeGap / 2 + lx, -h * spec.eyeY + ly);
    if ((st.blink || 0) > 0.5) sk([[e[0] - 6, e[1]], [e[0] + 6, e[1]]], { width: 3, amp: 0.4 });
    else dot(e[0], e[1], spec.eyeR);
  }

  // arms
  for (let i = 0; i < 2; i++) {
    if (st.skipArm === i) continue;
    const a = shoulders[i], b = handPos[i];
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, len = Math.hypot(b[0]-a[0], b[1]-a[1]);
    const bend = Math.min(18, len * 0.12) * (i ? 1 : -1);
    const nx = -(b[1] - a[1]) / (len || 1), ny = (b[0] - a[0]) / (len || 1);
    const ctrl = [mx + nx * bend, my + ny * bend];
    const pts = []; for (let k = 0; k <= 8; k++) { const u = k/8; pts.push([(1-u)*(1-u)*a[0] + 2*(1-u)*u*ctrl[0] + u*u*b[0], (1-u)*(1-u)*a[1] + 2*(1-u)*u*ctrl[1] + u*u*b[1]]); }
    sk(pts, { width: 3.4 });
    sk(circle(b[0], b[1], 5.5), { closed: true, fill: spec.color, width: 2.6, amp: 0.5 });
  }
  return { shoulders, hands: handPos };
}

// Walk helper: phase tied to distance so feet never slide.
const walkState = (x, amt) => ({ mode: 'walk', phase: x / 30, amt });

/* ==========================================================================
   Hero: the BLOOM wordmark, drawn in F-space (F.w = 2 units).
   Letters are monoline skeletons in letter units (cap height 1).
   ========================================================================== */

const WORDMARK = (() => {
  const arc = (cx, cy, r, a0, a1, n = 14) => { const o = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i/n); o.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]); } return o; };
  const H = Math.PI / 2, gap = 0.26;
  const letters = [
    { w: 0.55, color: 'ink',  strokes: [ [[0, -.5], [0, .5]],
                                         [[0, -.5], [.26, -.5], ...arc(.26, -.25, .25, -H, H).slice(1), [0, 0]],
                                         [[0, 0], [.3, 0], ...arc(.3, .25, .25, -H, H).slice(1), [0, .5]] ] },
    { w: 0.42, color: 'ink',  strokes: [ [[0, -.5], [0, .5], [.42, .5]] ] },
    { w: 1.0,  color: 'teal', strokes: [ arc(.5, 0, .5, -H, -H - Math.PI*2, 36) ] },
    { w: 1.0,  color: 'teal', strokes: [ arc(.5, 0, .5, -H, -H - Math.PI*2, 36) ] },
    { w: 0.8,  color: 'ink',  strokes: [ [[0, .5], [0, -.5], [.4, .12], [.8, -.5], [.8, .5]] ] },
  ];
  const total = letters.reduce((s, l) => s + l.w, 0) + gap * (letters.length - 1);
  const strokes = []; let x = -total / 2;
  for (const l of letters) {
    for (const s of l.strokes) {
      const pts = s.map(p => [p[0] + x, p[1]]);
      let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
      strokes.push({ pts, len, color: l.color });
    }
    x += l.w + gap;
  }
  return { strokes, total, length: strokes.reduce((s, k) => s + k.len, 0), unit: HERO.wordmarkWidth / total };
})();

function partial(pts, len) {            // first `len` of a polyline
  const out = [pts[0]]; let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    if (acc + d >= len) { const u = (len - acc) / (d || 1); out.push([lerp(pts[i-1][0], pts[i][0], u), lerp(pts[i-1][1], pts[i][1], u)]); return out; }
    out.push(pts[i]); acc += d;
  }
  return out;
}
function jitter(pts, amp, seed) {       // static, low-frequency sketch wobble
  let L = 0;
  return pts.map((p, i) => {
    if (i) L += Math.hypot(p[0] - pts[i-1][0], p[1] - pts[i-1][1]);
    return [p[0] + amp * Math.sin(L * 9 + seed * 6.28), p[1] + amp * Math.sin(L * 7.3 + seed * 4.1 + 1)];
  });
}
function extendEnds(pts, e) {
  if (pts.length < 2 || e <= 0) return pts;
  const a = pts[0], b = pts[1], y = pts[pts.length-1], z = pts[pts.length-2];
  const la = Math.hypot(a[0]-b[0], a[1]-b[1]) || 1, lz = Math.hypot(y[0]-z[0], y[1]-z[1]) || 1;
  return [[a[0] + (a[0]-b[0])/la*e, a[1] + (a[1]-b[1])/la*e], ...pts, [y[0] + (y[0]-z[0])/lz*e, y[1] + (y[1]-z[1])/lz*e]];
}

// opts: reveal 0..1, sketch 0..1 (1 = wobbly scribble, 0 = clean vector), ghost alpha
function drawWordmark(F, { reveal = 1, sketch = 0, alpha = 1 } = {}) {
  if (reveal <= 0) return;
  ctx.save();
  ctx.translate(F.cx, F.cy);
  ctx.scale(F.w / 2 * WORDMARK.unit, F.w / 2 * WORDMARK.unit);
  const prevA = ctx.globalAlpha; ctx.globalAlpha = prevA * alpha;
  let budget = reveal * WORDMARK.length;
  WORDMARK.strokes.forEach((s, i) => {
    if (budget <= 0) return;
    const pts = budget >= s.len ? s.pts : partial(s.pts, budget);
    budget -= s.len;
    const target = s.color === 'teal' ? COLORS.teal : COLORS.ink;
    const col = mixHex(COLORS.ink, target, 1 - sketch);
    const w = lerp(0.16, 0.05, sketch);
    const main = extendEnds(jitter(pts, 0.035 * sketch, i * 3 + 1), 0.07 * sketch);
    sk(main, { width: w, stroke: col, amp: INK.boil * 1.6 * sketch });
    if (sketch > 0.02) sk(extendEnds(jitter(pts, 0.05 * sketch, i * 3 + 2), 0.05 * sketch), { width: 0.03, stroke: COLORS.ink, amp: INK.boil * 2 * sketch, alpha: sketch * 0.75 });
  });
  ctx.globalAlpha = prevA;
  ctx.restore();
}
const Fh = F => F.w / HERO.aspect;
const Fpt = (F, u, v) => [F.cx + u * F.w / 2, F.cy + v * F.w / 2];

// Bubble ↔ bezel outline around F. m: 0 = thought bubble, 1 = monitor bezel.
function frameOutline(F, m) {
  const e = E.inOutSine(clamp01(m));
  const n = lerp(2.6, 12, e), margin = lerp(62, 26, e), bump = 15 * (1 - e);
  const hw = F.w / 2 + margin, hh = Fh(F) / 2 + margin, out = [];
  for (let i = 0; i < 120; i++) {
    const a = i / 120 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    let x = Math.sign(c) * Math.pow(Math.abs(c), 2 / n) * hw, y = Math.sign(s) * Math.pow(Math.abs(s), 2 / n) * hh;
    const r = Math.hypot(x, y) || 1, b = bump * Math.abs(Math.sin(a * 6));
    out.push([F.cx + x + x / r * b, F.cy + y + y / r * b]);
  }

}

/* ==========================================================================
   Camera — each world is placed so its hero frame F lands on a screen rect.
   ========================================================================== */

function camera(t) {
  const [p0, p1] = T.push, [q0, q1] = T.pull;
  if (t < p0) return { world: 'street', rect: { ...WORLDS.street.F } };
  if (t < p1) {
    const u = E.inCubic(prog(t, p0, p1)), F = WORLDS.street.F;
    return { world: 'street', rect: { cx: lerp(F.cx, 960, E.inOutSine(prog(t, p0, p1))), cy: lerp(F.cy, 540, E.inOutSine(prog(t, p0, p1))), w: Math.exp(lerp(Math.log(F.w), Math.log(PUSH_MAX_W), u)) } };
  }
  const F = WORLDS.studio.F;
  if (t < q1) {
    const u = E.outCubic(prog(t, q0, q1)), v = E.inOutSine(prog(t, q0, q1));
    return { world: 'studio', rect: { cx: lerp(960, F.cx, v), cy: lerp(540, F.cy, v), w: Math.exp(lerp(Math.log(PUSH_MAX_W), Math.log(F.w), u)) } };
  }
  // scene 3: a slow push toward the desk as the designer gets hands-on
  const k = E.inOutSine(prog(t, 9.6, 11.6));
  return { world: 'studio', rect: { cx: lerp(F.cx, F.cx + 40, k), cy: lerp(F.cy, F.cy + 10, k), w: lerp(F.w, F.w * 1.12, k) } };
}
function applyWorld(world, rect) {
  const F = WORLDS[world].F, k = rect.w / F.w;
  ctx.translate(rect.cx, rect.cy); ctx.scale(k, k); ctx.translate(-F.cx, -F.cy);
}

/* ==========================================================================
   The hero frame (bubble → bezel), shared by both worlds so it's continuous.
   ========================================================================== */

const morphAt = t => prog(t, T.morph[0], T.morph[1]);
const sketchAt = t => 1 - T.clicks.reduce((s, c) => s + E.outBack(prog(t, c, c + 0.36)) / T.clicks.length, 0);
const revealAt = t => E.inOutSine(prog(t, T.scribble[0], T.scribble[1]));

function drawHeroFrame(F, t, scale = 1, opts = {}) {
  const m = morphAt(t);
  ctx.save();
  ctx.translate(F.cx, F.cy); ctx.scale(scale, scale); ctx.translate(-F.cx, -F.cy);
  const bezelTone = E.inOutSine(clamp01((m - 0.55) / 0.45));        // bubble stays paper until it has left the frame
  sk(frameOutline(F, m), { closed: true, fill: mixHex(COLORS.paperHi, COLORS.bezel, bezelTone), width: 4 });
  const h = Fh(F);
  // the screen: blank underneath, the design sheet on top
  ctx.fillStyle = opts.peeling ? COLORS.screenOff : COLORS.paperHi;
  ctx.fillRect(F.cx - F.w/2, F.cy - h/2, F.w, h);
  if (bezelTone > 0) sk(rect(F.cx - F.w/2, F.cy - h/2, F.w, h), { closed: true, width: 2.4 * bezelTone });
  if (opts.peeling) drawWordmark(F, { alpha: 0.1 });              // ghost left on the screen
  else drawWordmark(F, { reveal: revealAt(t), sketch: sketchAt(t) });
  ctx.restore();
}

/* ==========================================================================
   Scene 2 & 3 — Studio world

function designerState(t) {
  let rot = 0, sy = 1 + 0.015 * Math.sin(t * 2.4);
  let look = [0.8, -0.1];
  // clicks: tiny squash per click
  for (const c of T.clicks) sy -= 0.05 * Math.max(0, settle(t - c + 0.02, 22, 0.35));
  // glance at the printer, then back, then shake the head
  const g = E.outBack(prog(t, T.glance, T.glance + 0.25)) * (1 - E.inOutCubic(prog(t, 9.02, 9.15)));
  look = [lerp(look[0], 1, g), lerp(look[1], 0.55, g)];
  rot += 0.06 * g;
  if (t > T.shake[0] && t < T.shake[1] + 0.2) {
    const u = prog(t, T.shake[0], T.shake[1]);
    const sh = Math.sin(u * Math.PI * 5) * (1 - u) * (t < T.shake[1] ? 1 : 0);
    rot += 0.08 * sh; look = [-sh * 0.9, 0.1];
  }
  // anticipation → reach → pull back
  sy *= keys(t, [[T.wind, 1], [T.reach[0], 0.9, E.outCubic], [T.reach[0] + 0.18, 1.07, E.outBack], [T.peel[0] + 0.2, 1.0]]);
  rot += keys(t, [[T.wind, 0], [T.reach[0], -0.09, E.outCubic], [T.reach[0] + 0.2, 0.08, E.outBack], [T.peel[0] + 0.3, -0.05], [T.peel[1], -0.07], [T.lift[0] + 0.5, 0, E.outBack]]);
  if (t > T.reach[0]) look = [0.9, -0.2];
  if (t > T.lift[0]) look = [lerp(0.9, 0.5, E.inOutCubic(prog(t, T.lift[0], T.lift[0] + 0.4))), lerp(-0.2, 0.2, E.inOutCubic(prog(t, T.lift[0], T.lift[0] + 0.4)))];
  const blink = [5.9, 7.7, 9.72, 11.75].some(b => t > b && t < b + 0.11) ? 1 : 0;
  return { t, x: 612, y: 712, sx: 1 / Math.sqrt(sy), sy, rot, dir: 1, look, blink, legs: { mode: 'sit' } };
}

// --- The peel: a sheet wrapping round a growing cylinder -----------------
const PEEL = (() => {
  const F = WORLDS.studio.F, h = Fh(F);
  const C = [F.cx + F.w/2, F.cy - h/2];                       // top-right corner, pinched
  const dl = Math.hypot(-1, 0.72), d = [-1 / dl, 0.72 / dl];  // pull direction (toward the designer)
  const n = [-d[1], d[0]];
  const corners = [[F.cx - F.w/2, F.cy - h/2], [F.cx + F.w/2, F.cy - h/2], [F.cx + F.w/2, F.cy + h/2], [F.cx - F.w/2, F.cy + h/2]];
  const aOf = P => (P[0] - C[0]) * d[0] + (P[1] - C[1]) * d[1];
  const Dmax = Math.max(...corners.map(aOf));
  return { F, h, C, d, n, corners, aOf, Dmax };
})();
const peelRadius = p => 18 + 0.38 * p;
function curlMap(s, p, r) {                // → [a', height] for paper s behind the fold
  const th = s / r;
  if (th <= Math.PI) return [p - r * Math.sin(th), r * (1 - Math.cos(th)), th];
  return [p + (s - Math.PI * r), 2 * r, Math.PI];
}
function clipHalf(poly, f) {               // keep f(P) >= 0 (convex polygon)
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const A = poly[i], B = poly[(i + 1) % poly.length], fa = f(A), fb = f(B);
    if (fa >= 0) out.push(A);
    if ((fa >= 0) !== (fb >= 0)) { const u = fa / (fa - fb); out.push([lerp(A[0], B[0], u), lerp(A[1], B[1], u)]); }
  }
  return out;
}
function peelAmount(t) {
  return keys(t, [[T.peel[0], 0], [T.peel[0] + 0.14, 24, E.outBack], [T.peel[0] + 0.24, 18, E.inOutSine], [T.peel[1], PEEL.Dmax + 1, E.inOutCubic]]);
}
function cornerAt(p) {
  const [a] = curlMap(p, p, peelRadius(p));
  return [PEEL.C[0] + a * PEEL.d[0], PEEL.C[1] + a * PEEL.d[1]];
}
// After the sheet comes free it is carried: rotate about the pinched corner and move.
function carry(t) {
  const u = E.inOutBack(prog(t, T.lift[0], T.lift[1] - 0.05));
  const Q = cornerAt(PEEL.Dmax + 1);
  return { Q, dx: lerp(0, 748 - Q[0], u), dy: lerp(0, 548 - Q[1], u), ang: lerp(0, 0.42, u) + 0.03 * Math.sin((t - T.lift[0]) * 5) * u };
}

function drawSheetContent(F) {
  ctx.fillStyle = COLORS.paperHi;
  ctx.fillRect(F.cx - F.w/2 - 1, F.cy - Fh(F)/2 - 1, F.w + 2, Fh(F) + 2);
  drawWordmark(F, { sketch: 0 });
}

function drawPeel(t, layer) {
  const { F, C, d, n, corners, aOf, Dmax } = PEEL;
  const p = peelAmount(t), r = peelRadius(p);
  const car = t > T.lift[0] ? carry(t) : null;
  ctx.save();
  if (car) { ctx.translate(car.Q[0] + car.dx, car.Q[1] + car.dy); ctx.rotate(car.ang); ctx.translate(-car.Q[0], -car.Q[1]); }

  if (layer === 'flat') {
    // the part still stuck to the screen
    const flat = clipHalf(corners, P => aOf(P) - p);
    if (flat.length > 2) {
      ctx.save(); trace(flat, true); ctx.clip(); drawSheetContent(F); ctx.restore();
    }
    ctx.restore(); return;
  }

  // shadow of the lifted flap on whatever is beneath
  const N = 44, strips = [];
  for (let i = 0; i < N; i++) {
    const s0 = p * i / N, s1 = p * (i + 1) / N;
    const poly = clipHalf(clipHalf(corners, P => aOf(P) - (p - s1) + 0.6), P => (p - s0) + 0.6 - aOf(P));
    if (poly.length < 3) continue;
    const [a0, h0, th0] = curlMap(s0, p, r), [a1, h1, th1] = curlMap(s1, p, r);
    const A0 = p - s0, A1 = p - s1, beta = (a1 - a0) / ((A1 - A0) || 1e-6), k = beta - 1;
    const dC = d[0] * C[0] + d[1] * C[1];
    const off = (a0 - A0) - k * (dC + A0);
    strips.push({ poly, M: [1 + k*d[0]*d[0], k*d[0]*d[1], k*d[0]*d[1], 1 + k*d[1]*d[1], d[0]*off, d[1]*off], hm: (h0 + h1) / 2, th: (th0 + th1) / 2 });
  }
  for (const s of strips) {
    ctx.save(); ctx.transform(...s.M);
    ctx.translate(s.hm * 0.10, s.hm * 0.16);
    trace(s.poly, true); ctx.fillStyle = `rgba(35,40,43,${0.05 + 0.05 * Math.min(1, s.hm / 60)})`; ctx.fill();
    ctx.restore();
  }
  // the strips, fold outward so the curl overlaps itself correctly
  for (const s of strips) {
    ctx.save(); ctx.transform(...s.M);
    trace(s.poly, true); ctx.clip();
    const front = Math.cos(s.th) > 0;
    if (front) {
      drawSheetContent(F);
      ctx.fillStyle = `rgba(35,40,43,${0.22 * Math.pow(Math.sin(s.th), 1.4)})`;
    } else {
      ctx.fillStyle = COLORS.underside; ctx.fillRect(F.cx - F.w, F.cy - F.w, F.w * 2, F.w * 2);
      ctx.fillStyle = `rgba(35,40,43,${0.05 + 0.16 * Math.max(0, Math.sin(s.th))})`;
    }
    ctx.fillRect(F.cx - F.w, F.cy - F.w, F.w * 2, F.w * 2);
    ctx.restore();
  }
  // ink: outline of the whole deformed sheet, plus the crest of the curl
  const edge = poly(corners, true, 8).map(P => {
    const a = aOf(P); if (a >= p) return P;
    const [a2] = curlMap(p - a, p, r); return [P[0] + (a2 - a) * d[0], P[1] + (a2 - a) * d[1]];
  });
  sk(edge, { closed: true, width: 2.6, amp: 0.8 });
  if (p > 8) {
    const crestA = p - Math.min(p, Math.PI * r / 2);
    const seg2 = clipHalf(clipHalf(corners, P => aOf(P) - crestA + 0.01), P => crestA + 0.01 - aOf(P));
    if (seg2.length >= 2) {
      const a2 = curlMap(p - crestA, p, r)[0] - crestA;
      const pts = seg2.map(P => [P[0] + a2 * d[0], P[1] + a2 * d[1]]);
      sk([pts[0], pts[pts.length > 2 ? 2 : 1]], { width: 1.8, alpha: 0.55, amp: 0.6 });
    }
  }
  ctx.restore();
}
function peelHand(t) {
  const p = peelAmount(t), Q = cornerAt(p);
  if (t <= T.lift[0]) return Q;
  const c = carry(t); return [c.Q[0] + c.dx, c.Q[1] + c.dy];
}

  sk([[1470, 280], [1452, 236]], { width: 3 }); sk([[1470, 280], [1494, 228]], { width: 3 });
  sk(ellipse(1446, 232, 14, 8, 12), { closed: true, fill: COLORS.tealSoft, width: 2.4 });
  sk(ellipse(1498, 224, 14, 8, 12), { closed: true, fill: COLORS.tealSoft, width: 2.4 });
  sk(rect(1330, 250, 34, 80), { closed: true, fill: COLORS.designer, width: 2.6 });
  sk(rect(1366, 262, 28, 68), { closed: true, fill: COLORS.tealSoft, width: 2.6 });
  // door on the far right (scene 4 leaves through it)
  sk(rect(1640, 300, 230, 570), { closed: true, fill: '#dccfb8' });
  dot(1660, 600, 5);
  // printer on its cabinet
  sk(rect(1300, 740, 240, 130), { closed: true, fill: COLORS.desk });
  drawPrinter(t);
  // desk
  sk(rect(700, 652, 800, 24), { closed: true, fill: COLORS.desk });
  sk([[730, 676], [730, 870]], { width: 5 }); sk([[1470, 676], [1470, 870]], { width: 5 });
  // monitor stand
  sk(rect(990, 600, 40, 52), { closed: true, fill: COLORS.bezel });
  sk(ellipse(1010, 652, 86, 8, 22), { closed: true, fill: COLORS.bezel, width: 3 });
  // keyboard, mouse
  sk(rrect(840, 634, 180, 16, 5), { closed: true, fill: '#e9e4d8', width: 2.6 });
  const press = T.clicks.some(c => t > c - 0.02 && t < c + 0.08) ? 2 : 0;
  sk(ellipse(752, 642 + press, 17, 10, 16), { closed: true, fill: '#e9e4d8', width: 2.6 });
}

function drawStudioScene(t) {
  drawStudio(t);
  const F = WORLDS.studio.F;
  const peeling = t >= T.peel[0];
  drawHeroFrame(F, t, 1, { peeling });
  if (peeling) drawPeel(t, 'flat');
  // screen UI: cursor, click rings, the swatch
  if (!peeling) drawScreenUI(F, t);
  // stool + designer
  sk(ellipse(612, 716, 62, 10, 20), { closed: true, fill: COLORS.desk, width: 3 });
  sk([[578, 724], [560, 870]], { width: 4 }); sk([[646, 724], [664, 870]], { width: 4 });
  const st = designerState(t);
  // right hand: mouse → reach → corner → carry
  let hand = [752, 634 + (T.clicks.some(c => t > c - 0.02 && t < c + 0.08) ? 2 : 0)];
  if (t > T.reach[0]) {
    const target = peelHand(t);
    const u = E.outBack(prog(t, T.reach[0], T.reach[1]));
    hand = t < T.reach[1] ? [lerp(hand[0], target[0], u), lerp(hand[1], target[1], u)] : target;
  }
  st.hands = [null, hand];
  // draw body without arms first so the sheet can pass in front of it
  const armless = { ...st, skipArm: 1 };
  if (peeling) {
    drawCharacter(CHARACTERS.designer, armless);
    drawPeel(t, 'flap');
    drawArm(st, hand);
  } else {
    drawCharacter(CHARACTERS.designer, st);
  }
}
// Re-draw just the reaching arm + pinching hand on top of the sheet.
function drawArm(st, hand) {
  const spec = CHARACTERS.designer, f = charFrame(spec, st);
  const a = f.L2W(spec.w * 0.5, -spec.h * 0.46);
  const mx = (a[0] + hand[0]) / 2, my = (a[1] + hand[1]) / 2, len = Math.hypot(hand[0]-a[0], hand[1]-a[1]);
  const nx = -(hand[1] - a[1]) / (len || 1), ny = (hand[0] - a[0]) / (len || 1), bend = Math.min(18, len * 0.12);
  const pts = []; for (let k = 0; k <= 10; k++) { const u = k/10; pts.push([(1-u)*(1-u)*a[0] + 2*(1-u)*u*(mx + nx*bend) + u*u*hand[0], (1-u)*(1-u)*a[1] + 2*(1-u)*u*(my + ny*bend) + u*u*hand[1]]); }
  sk(pts, { width: 3.4 });
  sk(circle(hand[0], hand[1], 6), { closed: true, fill: spec.color, width: 2.6, amp: 0.5 });
  sk([[hand[0] - 3, hand[1] - 9], [hand[0] + 1, hand[1] - 3]], { width: 2.4, amp: 0.3 });
}

function drawScreenUI(F, t) {
  const pts = [[0.55, 0.45], [-0.3, 0.08], [0.12, -0.05], [0.7, -0.4]];
  const times = [6.0, ...T.clicks];
  let u = pts[0][0], v = pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    const k = E.inOutCubic(prog(t, times[i] - 0.34, times[i] - 0.04));
    u = lerp(u, pts[i][0], k); v = lerp(v, pts[i][1], k);
  }
  // click rings
  T.clicks.forEach((c, i) => {
    const k = prog(t, c, c + 0.35);
    if (k > 0 && k < 1) { const [x, y] = Fpt(F, pts[i + 1][0], pts[i + 1][1]); sk(circle(x, y, 6 + 26 * E.outCubic(k)), { closed: true, stroke: COLORS.teal, width: 2.4 * (1 - k) + 0.4, amp: 0.4 }); }
  });
  // swatch
  const s = E.outBackBig(prog(t, T.swatch, T.swatch + 0.32));
  if (s > 0.01) {
    const [x, y] = Fpt(F, 0.78, -0.43);
    sk(circle(x, y, 19 * s), { closed: true, fill: COLORS.teal, width: 2.6 });
    sk(circle(x - 36 * s, y + 4, 11 * s), { closed: true, fill: COLORS.tealSoft, width: 2.2 });
  }
  // cursor (only once we're at the desk)
  if (t > 5.9) {
    const [x, y] = Fpt(F, u, v);
    sk([[x, y], [x, y + 22], [x + 6, y + 16], [x + 11, y + 25], [x + 15, y + 23], [x + 10, y + 14], [x + 17, y + 14]], { closed: true, fill: COLORS.paperHi, width: 2.2, amp: 0.3 });
  }
}

/* ==========================================================================
   Placeholder for scenes not built yet (review build only).
   ========================================================================== */

function drawTodo(t) {
  drawStudioScene(Math.min(t, BUILT_UNTIL - 0.001));
}

/* ==========================================================================
   Frame
   ========================================================================== */

let W = 1920, H = 1080, PORTRAIT = false, K = 1;
let grain = null;

function buildGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 320;
  const g = c.getContext('2d'), img = g.createImageData(320, 320);
  let seed = 12345; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < img.data.length; i += 4) {
    const v = rnd();
    img.data[i] = img.data[i+1] = img.data[i+2] = v > 0.5 ? 255 : 40;
    img.data[i+3] = Math.round(Math.pow(Math.abs(v - 0.5) * 2, 3) * 38);
  }
  g.putImageData(img, 0, 0);
  g.strokeStyle = 'rgba(120,100,70,0.06)'; g.lineWidth = 0.8;
  for (let i = 0; i < 70; i++) { const x = rnd() * 320, y = rnd() * 320, a = rnd() * 6.28, l = 6 + rnd() * 18; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  grain = ctx.createPattern(c, 'repeat');
}

function drawFrame(tIn) {
  const t = ((tIn % DURATION) + DURATION) % DURATION;
  BOIL = Math.floor(t * FPS / BOIL_EVERY);
  STROKE = 0;
  const fit = PORTRAIT ? PORTRAIT_VIEW.fit : 1;
  BASE_SCALE = K * fit;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = COLORS.paper; ctx.fillRect(0, 0, canvas.width, canvas.height);

  // stage: 1920×1080 design space centred in either orientation
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.translate(W / 2, H / 2); ctx.scale(fit, fit);
  ctx.translate(PORTRAIT ? -PORTRAIT_VIEW.cx : -960, PORTRAIT ? -PORTRAIT_VIEW.cy : -540);

  const cam = camera(Math.min(t, BUILT_UNTIL));
  ctx.save();
  applyWorld(cam.world, cam.rect);
  if (t >= BUILT_UNTIL) drawTodo(t);
  else if (cam.world === 'street') drawStreet(t);
  else drawStudioScene(t);
  ctx.restore();

  // paper grain + a whisper of vignette
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = grain; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const vg = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.35, canvas.width / 2, canvas.height / 2, Math.hypot(canvas.width, canvas.height) * 0.6);
  vg.addColorStop(0, 'rgba(90,70,40,0)'); vg.addColorStop(1, 'rgba(90,70,40,0.10)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (t >= BUILT_UNTIL) {
    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.fillStyle = 'rgba(243,239,230,0.82)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = COLORS.ink; ctx.textAlign = 'center';
    ctx.font = '600 44px ui-sans-serif, system-ui, sans-serif';
    const sc = SCENES.find(s => t >= s.t0 && t < s.t1) || SCENES[SCENES.length - 1];
    ctx.fillText(`Scene ${sc.id}: ${sc.name}`, W / 2, H / 2 - 10);
    ctx.font = '500 26px ui-sans-serif, system-ui, sans-serif'; ctx.fillStyle = '#6d6a62';
    ctx.fillText('Not built yet: scenes 1–3 are ready for review', W / 2, H / 2 + 36);
  }
}

/* ==========================================================================
   Canvas sizing + review controls (the only code that reads a clock).
   ========================================================================== */

const params = new URLSearchParams(location.search);
const NATIVE = params.get('native') === '1';
if (params.get('ui') === '0') document.body.classList.add('noui');
PORTRAIT = params.get('portrait') === '1';

function resize() {
  W = PORTRAIT ? 1080 : 1920; H = PORTRAIT ? 1920 : 1080;
  const stage = document.getElementById('stage');
  const pad = document.body.classList.contains('noui') ? 0 : 24;
  const aw = stage.clientWidth - pad, ah = stage.clientHeight - pad;
  const cssW = Math.max(10, Math.min(aw, ah * W / H)), cssH = cssW * H / W;
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  const dpr = window.devicePixelRatio || 1;
  canvas.width = NATIVE ? W : Math.max(2, Math.round(cssW * dpr));
  canvas.height = NATIVE ? H : Math.max(2, Math.round(cssH * dpr));
  K = canvas.width / W;
  if (!grain) buildGrain();
  document.getElementById('orient').textContent = PORTRAIT ? '9:16' : '16:9';
  drawFrame(currentTime());
}

const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), sceneSel = document.getElementById('scene');
const ICON_PLAY = '<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>';
let playing = !params.has('t'), origin = performance.now(), held = params.has('t') ? parseFloat(params.get('t')) || 0 : 0, scrubbing = false;
const LOOP_END = BUILT_UNTIL;          // review build loops over what exists

function currentTime() { return playing ? ((performance.now() - origin) / 1000) % LOOP_END : held; }
function setPlaying(p) { const t = currentTime(); playing = p; if (p) origin = performance.now() - (t % LOOP_END) * 1000; else held = t; playBtn.innerHTML = p ? ICON_PAUSE : ICON_PLAY; }
function seek(t) { held = Math.max(0, Math.min(DURATION - 0.001, t)); origin = performance.now() - (held % LOOP_END) * 1000; drawFrame(held); updateUI(held); }
function updateUI(t) {
  if (!scrubbing) scrub.value = t.toFixed(3);
  timeEl.innerHTML = `<b>${t.toFixed(2).padStart(5, '0')}</b> / ${DURATION.toFixed(2)}`;
  const sc = SCENES.find(s => t >= s.t0 && t < s.t1); if (sc && document.activeElement !== sceneSel) sceneSel.value = String(sc.id);
}

SCENES.forEach(s => {
  const o = document.createElement('option'); o.value = s.id;
  o.textContent = `${s.id}. ${s.name}${s.t0 >= BUILT_UNTIL ? ' (not built)' : ''}`; sceneSel.appendChild(o);
  if (s.t0 > 0) { const d = document.createElement('div'); d.className = 'tick'; d.style.left = `calc(6px + (100% - 12px) * ${s.t0 / DURATION})`; document.getElementById('track').appendChild(d); }
});
const rail = document.getElementById('rail');
rail.innerHTML = `<i class="todo" style="left:${BUILT_UNTIL / DURATION * 100}%;right:0"></i>`;

playBtn.addEventListener('click', () => setPlaying(!playing));
scrub.addEventListener('input', () => { scrubbing = true; if (playing) setPlaying(false); seek(parseFloat(scrub.value)); });
scrub.addEventListener('change', () => { scrubbing = false; });
sceneSel.addEventListener('change', () => { const s = SCENES.find(x => x.id === +sceneSel.value); seek(s.t0); if (s.t0 < BUILT_UNTIL && !playing) setPlaying(true); });
document.getElementById('orient').addEventListener('click', () => { PORTRAIT = !PORTRAIT; resize(); });
window.addEventListener('keydown', e => {
  if (e.target === sceneSel) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { e.preventDefault(); if (playing) setPlaying(false); seek(currentTime() + (e.code === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 1 / FPS)); }
});
window.addEventListener('resize', resize);
function loop() { if (playing) { const t = currentTime(); drawFrame(t); updateUI(t); } requestAnimationFrame(loop); }

playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
resize(); updateUI(currentTime()); requestAnimationFrame(loop);

window.renderFrame = t => { if (playing) setPlaying(false); held = t; drawFrame(t); updateUI(((t % DURATION) + DURATION) % DURATION); };
window.setPortrait = p => { PORTRAIT = !!p; resize(); };
window.DURATION = DURATION;
</script>
