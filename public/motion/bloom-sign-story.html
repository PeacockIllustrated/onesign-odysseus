<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloom Sign Story</title>
<!--
  The story of a sign being made by Onesign, ~40s. The customer is a paper character;
  Onesign's staff are the Onesign mark itself, the 1 lit in each one's colour.

  1 Shop front → 2 Into the studio → 3 Peel & throw → 4 The flight, signed off
  in slow motion by the project manager as it flies past his desk →
  5 Fabrication → 6 The van → 7 The fit. The BLOOM design is one object the
  whole way: thought bubble → monitor → peeled sheet → template → letters →
  parcel → fascia. Scene changes follow it; there are no cuts or fades.

  Deterministic: drawFrame(t) is a pure function of t. window.renderFrame(t)
  for Remotion. URL params: ?t=6.5 freeze   ?ui=0 hide bar   ?portrait=1
  ?native=1 back the canvas at exactly 1920×1080 / 1080×1920.
-->
<style>
  :root { color-scheme: light; --paper:#f3efe6; --bar:#ebe5d8; --ink:#23282b; --muted:#6d6a62; --teal:#4e7e8c; --line:#d6cfbf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden;
    font: 500 13px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: absolute; inset: 0 0 calc(60px + env(safe-area-inset-bottom, 0px)) 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  body.noui #stage { bottom: 0; padding: 0; }
  body.noui #bar { display: none; }
  canvas { display: block; border-radius: 3px; box-shadow: 0 0 0 1px var(--line), 0 14px 40px rgba(35,40,43,.12); }
  body.noui canvas { border-radius: 0; box-shadow: none; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(60px + env(safe-area-inset-bottom, 0px));
    padding: 0 16px env(safe-area-inset-bottom, 0px); display: flex; align-items: center; gap: 10px;
    background: var(--bar); border-top: 1px solid var(--line); }
  button, select { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink);
    border-radius: 999px; height: 34px; padding: 0 12px; cursor: pointer; flex: none; }
  button:hover, select:hover { background: #fffdf8; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  #play { width: 34px; padding: 0; display: grid; place-items: center; }
  #play svg { width: 12px; height: 12px; fill: currentColor; }
  #track { position: relative; flex: 1; min-width: 80px; height: 34px; display: flex; align-items: center; }
  #rail { position: absolute; left: 6px; right: 6px; height: 6px; border-radius: 3px; border: 1.5px solid var(--ink); }
  #scrub { position: relative; z-index: 1; width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; height: 34px; cursor: pointer; }
  #scrub::-webkit-slider-runnable-track { height: 6px; background: transparent; }
  #scrub::-moz-range-track { height: 6px; background: transparent; }
  #scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%; background: var(--teal); border: 1.5px solid var(--ink); }
  #scrub::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--teal); border: 1.5px solid var(--ink); }
  .tick { position: absolute; top: 4px; bottom: 4px; width: 1.5px; background: rgba(35,40,43,.35); pointer-events: none; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 88px; text-align: right; }
  #time b { color: var(--ink); font-weight: 600; }
  @media (max-width: 620px) { #time { display: none; } #scene { max-width: 118px; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar">
  <button id="play" aria-label="Play / pause"></button>
  <select id="scene" aria-label="Jump to scene"></select>
  <div id="track"><div id="rail"></div><input id="scrub" type="range" min="0" max="37" step="0.001" value="0" aria-label="Scrub"></div>
  <div id="time"><b>00.00</b></div>
  <button id="orient" aria-label="Toggle orientation">16:9</button>
</div>
<script>
'use strict';

/* ==========================================================================
   SETTINGS: timings, colours, characters. Tune here.
   ========================================================================== */

const STORY_END = 37.1;               // story seconds; real playback length is DURATION (the flight plays faster, the sign-off slower)
const FPS = 60;
const BOIL_EVERY = 3;                 // frames per re-seed of the line boil

const SCENES = [
  { id: 1, name: 'Shop front',      t0: 0,     t1: 4     },
  { id: 2, name: 'Into the studio', t0: 4,     t1: 8     },
  { id: 3, name: 'Peel & throw',    t0: 8,     t1: 10.75 },
  { id: 4, name: 'Flight & sign-off', t0: 10.75, t1: 12.95 },
  { id: 5, name: 'Fabrication',     t0: 12.95, t1: 20    },
  { id: 6, name: 'The van',         t0: 20,    t1: 27.5  },
  { id: 7, name: 'The fit',         t0: 27.5,  t1: STORY_END },
];

const COLORS = {
  paper:     '#f3efe6',
  paperHi:   '#fbf8f1',
  ink:       '#23282b',
  teal:      '#4e7e8c',
  tealSoft:  '#a8c3ca',
  tealDark:  '#35606c',
  // street
  facade: '#e7dfcf', neighbourL: '#ddd3c1', neighbourR: '#e1d8c7',
  fascia: '#cdc6b8', glass: '#dde4e1', pavement: '#e8e1d4', road: '#dcd5c8',
  // studio
  wall: '#f3efe6', floor: '#e6dfd1', desk: '#d9c7a8', bezel: '#3b4246', rug: '#dfe7e6', cork: '#d8c3a0',
  screenOff: '#eceee9', underside: '#e3ddcf', sky: '#dfe9ea', roof: '#cfc6b5', hill: '#e4ddcd', tree: '#b9cbc6',
  // warehouse
  shopWall: '#ebe6dc', block: '#dcd6cb', steel: '#8d9699', concrete: '#e0dbd1', sheetStock: ['#a8c3ca', '#fbf8f1', '#e9b44c', '#e07a5f', '#4e7e8c'],
  // fabricated letters
  faceInk: '#2f3538', returnInk: '#646c70', hole: '#bfb7a6', led: '#fff0c4', glow: '#ffd98a',
  wrap: 'rgba(226,240,241,0.82)', van: '#fbf8f1',
  // characters: one warm colour each
  customer:   '#e07a5f',
  designer:   '#e9b44c',
  fabricator: '#cf5c78',
  fitterA:    '#f2a65a',
  fitterB:    '#b9573f',
  pm:         '#4e7e8c',
  printer:    '#bfc1bf',
};

const INK = { width: 3.4, boil: 1.25 };            // boil amplitude in screen px

// The customer is a paper character. Onesign's staff are the Onesign mark itself: the logo icon in ink,
// the 1 lit in their colour, an eye either side of the stem, and the one bit of kit that says the job.
const CHARACTERS = {
  customer:   { shape: 'pill', w: 124, h: 202, legLen: 70, color: COLORS.customer,   eyeGap: 34, eyeY: 0.72, eyeR: 7,   k: 1.35 },
  designer:   { shape: 'mark', w: 176, legLen: 52, color: COLORS.designer,   k: 1.3 },
  pm:         { shape: 'mark', w: 150, legLen: 48, color: COLORS.pm,         k: 1.2, kit: 'headset' },
  fabricator: { shape: 'mark', w: 172, legLen: 58, color: COLORS.fabricator, k: 1.3, kit: 'goggles' },
  fitterA:    { shape: 'mark', w: 132, legLen: 50, color: COLORS.fitterA,    k: 1.2, kit: 'hardhat' },
  fitterB:    { shape: 'mark', w: 140, legLen: 50, color: COLORS.fitterB,    k: 1.2, kit: 'hardhat' },
};
// The icon in its own SVG units: the O spans x 0–157, y 10–152; the 1 is cut out of it.
const MARK_ICON = { w: 157, h: 142, cx: 78.5, base: 152, eyes: [[46, 112], [134, 102]], eyeR: 12 };
for (const s of Object.values(CHARACTERS)) if (s.shape === 'mark') s.h = s.w * MARK_ICON.h / MARK_ICON.w;

const HAND = { r: 6, stretchGrow: 3.2, carried: 1.8 };   // designer's hand swells as the arm stretches
const PAPER = 0.34;                   // the design shrinks to regular paper size in flight

const HERO = { aspect: 1.6, wordmarkWidth: 1.46 /* in F units, F.w = 2 */ };
const OX = -9000;                     // where the shop sits in the main world
const WORLDS = {
  street: { F: { cx: 930, cy: 400, w: 340 } },            // the thought bubble, above the customer
  main:   { F: { cx: 960, cy: 420, w: 420 } },            // the studio monitor
};
const BED = { cx: -1040, cy: 520, w: 420 };               // CNC bed: same size as the design
const FASCIA = { cx: OX + 960, cy: 206, H: 86 };
const PUSH_MAX_W = 3800;
// Framed for 9:16 first: the phone sees an 830-wide slice at 1.3×; 16:9 sees the same shot with more room.
const PORTRAIT_VIEW = { fit: 1.3, cx: 960, cy: 540 };

// Beat times (seconds)
const T = {
  // 1 shop front
  walkStart: 0.25, walkEnd: 1.75, lookUp: 2.0, tilt: 2.35, blink1: 2.62,
  cloud: [2.55, 2.68, 2.81], bubble: 2.9, scribble: [3.08, 3.95],
  // 2 studio
  push: [4.0, 5.35], pull: [5.35, 6.8], morph: [4.3, 6.4], clicks: [6.35, 6.8, 7.25], swatch: 7.32,
  // 3 peel & throw
  tools: [5.95, 6.55, 7.0, 7.5],           // pen → align guides → paint bucket
  glance: 8.0, judder: [8.3, 9.0], shake: [9.0, 9.3], wind: 9.25, reach: [9.4, 9.7],
  peel: [9.7, 10.3], toss: [10.3, 10.75],
  // 4 flight (the throw carries straight through). The project manager signs it off on the way past:
  // looks up, crouches, leaps; time slows while he turns with the page, reads it, thumbs up, tick;
  // time snaps back and he drops into his chair. The page never leaves its path.
  flight: [10.75, 12.45], catch: [12.45, 12.95],
  pm: { notice: 10.45, crouch: [10.8, 10.96], leap: [10.96, 11.16], slow: [11.12, 11.42], scan: [11.18, 11.31],
        thumb: [11.31, 11.345], tick: 11.345, back: [11.44, 11.95] },
  // 5 fabrication
  place: [12.95, 13.6], router: [13.85, 16.2], extrude: [16.3, 17.3], leds: [17.45, 18.6], thumbs: 18.75, glow: [19.05, 19.8],
  // 6 van
  // load: shutter up, tail lift out and down, parcel lands, lift rises, parcel slides in, shutter down, lift folds
  wrap: [19.95, 20.7], hop: [20.85, 22.0], shutter1: [20.3, 20.5], liftOut1: [20.4, 20.6], liftDrop1: [20.6, 20.85],
  liftUp1: [22.15, 22.6], slide: [22.7, 23.1], shutter1Close: [23.15, 23.35], liftFold1: [23.35, 23.65], drive: [24.0, 27.5],
  // 7 fit
  // unload: the same in reverse at the shop
  shutter2: [27.7, 27.9], liftOut2: [27.85, 28.1], slideOut: [28.15, 28.5], liftDrop2: [28.5, 28.85], pickup: [28.85, 29.3],
  fitOut: [27.75, 28.2], ladder: [28.55, 28.95], climb: [28.95, 29.5], letter0: 29.6, letterStep: 0.46, letterDur: 0.36, letterCatch: 0.18,
  halo: 32.3, pack: [32.3, 32.7], liftIn2: [32.3, 32.7], leave: [32.75, 33.4],
  custIn: [32.95, 33.75], custLook: 33.77, celebrate: [33.85, 34.95], door: [35.05, 35.45],
  // dusk gathers while the letters go up, night falls as they pack away, the customer arrives under the lit sign
  nightKeys: [[30.0, 0], [31.5, 0.35], [33.2, 1], [35.5, 1], [36.2, 0]],
  morning: [35.5, 36.2],                    // the sign's timer switches off with the daylight
  endFocus: [36.35, 37.08],                 // soft focus down onto the pavement: the loop point
};

/* ==========================================================================
   Easing, springs, hashing: all pure.
   ========================================================================== */

const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const lerp = (a, b, u) => a + (b - a) * u;
const lerp2 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
const prog = (t, a, b) => clamp01((t - a) / (b - a));
const E = {
  inOutSine: u => -(Math.cos(Math.PI * u) - 1) / 2,
  inQuad: u => u * u,
  inCubic: u => u * u * u,
  outCubic: u => 1 - Math.pow(1 - u, 3),
  inOutCubic: u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2,
  outBack: u => { const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  outBackSoft: u => { const c = 0.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  outBackBig: u => { const c = 2.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
};
function spring(t, w = 14, z = 0.32) {
  if (t <= 0) return 0;
  const wd = w * Math.sqrt(1 - z*z);
  return 1 - Math.exp(-z*w*t) * (Math.cos(wd*t) + (z*w/wd) * Math.sin(wd*t));
}
const settle = (t, w = 16, z = 0.3) => t <= 0 ? 0 : Math.exp(-z*w*t) * Math.sin(w*Math.sqrt(1 - z*z)*t);
function keys(t, k) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) {
    const [t0, v0] = k[i-1], [t1, v1, e] = k[i];
    return lerp(v0, v1, (e || E.inOutCubic)((t - t0) / (t1 - t0)));
  }
  return k[k.length - 1][1];
}
function catmull(P, u) {
  const n = P.length - 1, x = clamp01(u) * n, i = Math.min(n - 1, Math.floor(x)), s = x - i;
  const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(n, i + 2)];
  const f = (a, b, c, d) => 0.5 * (2*b + (-a + c)*s + (2*a - 5*b + 4*c - d)*s*s + (-a + 3*b - 3*c + d)*s*s*s);
  return [f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])];
}
// A spline sampled by arc length, so speed along it is exactly what the easing says.
function arcPath(P, n = 600) {
  const pts = []; for (let i = 0; i <= n; i++) pts.push(catmull(P, i / n));
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function pathAt(A, s) {
  const d = clamp01(s) * A.len; let lo = 0, hi = A.cum.length - 1;
  while (lo < hi - 1) { const m = (lo + hi) >> 1; if (A.cum[m] <= d) lo = m; else hi = m; }
  return lerp2(A.pts[lo], A.pts[hi], (d - A.cum[lo]) / ((A.cum[hi] - A.cum[lo]) || 1));
}
function hash(n) {
  let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b);
  x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
// The flight plays faster than the rest: story time runs at speedAt(s) × real time, eased in and out.
const FLIGHT_SPEED = { k: 1.7, rampIn: [11.7, 11.85], rampOut: [12.15, 12.5] };   // speeds up once the sign-off is done
// Inside it, the sign-off plays in slow motion: SLOWMO.k × real time, with short ramps so the drop is felt.
const SLOWMO = { k: 0.085, rampIn: 0.07, rampOut: 0.04 };
const slowEnv = s => E.inOutSine(prog(s, T.pm.slow[0] - SLOWMO.rampIn, T.pm.slow[0])) * (1 - E.inOutSine(prog(s, T.pm.slow[1], T.pm.slow[1] + SLOWMO.rampOut)));
const flightSpeed = s => 1 + (FLIGHT_SPEED.k - 1) * E.inOutSine(prog(s, ...FLIGHT_SPEED.rampIn)) * (1 - E.inOutSine(prog(s, ...FLIGHT_SPEED.rampOut)));
const speedAt = s => lerp(flightSpeed(s), SLOWMO.k, slowEnv(s));
const WARP = (() => {
  const ds = 0.001, n = Math.ceil(STORY_END / ds), r = new Float64Array(n + 1);
  for (let i = 1; i <= n; i++) r[i] = r[i - 1] + ds / speedAt((i - 0.5) * ds);
  return { ds, n, r };
})();
const DURATION = WARP.r[WARP.n];      // real seconds
function realAt(st) { const x = clamp01(st / STORY_END) * WARP.n, i = Math.min(WARP.n - 1, Math.floor(x)); return lerp(WARP.r[i], WARP.r[i + 1], x - i); }
function storyAt(rt) {
  let lo = 0, hi = WARP.n; if (rt <= 0) return 0; if (rt >= WARP.r[hi]) return STORY_END;
  while (lo < hi - 1) { const m = (lo + hi) >> 1; if (WARP.r[m] <= rt) lo = m; else hi = m; }
  return (lo + (rt - WARP.r[lo]) / (WARP.r[hi] - WARP.r[lo])) * WARP.ds;
}
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixHex = (a, b, u) => { const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], u)))})`; };

/* ==========================================================================
   Ink: hand-drawn strokes with a boil that re-seeds every BOIL_EVERY frames.
   ========================================================================== */

const canvas = document.getElementById('c');
const MAIN_CTX = canvas.getContext('2d');
let ctx = MAIN_CTX;                   // swapped to an offscreen context while the world renders for the focus pull
const focusCanvas = document.createElement('canvas'), focusCtx = focusCanvas.getContext('2d');
let BASE_SCALE = 1, BOIL = 0, STROKE = 0;

const worldScale = () => { const m = ctx.getTransform(); return Math.max(0.05, Math.sqrt(Math.abs(m.a * m.d - m.b * m.c))) / BASE_SCALE; };   // area scale: squashed frames don't blow the boil up

function boil(pts, amp, closed) {
  const id = STROKE++;
  if (!amp || pts.length < 2) return pts;
  const s = worldScale(), A = amp / s;
  let total = 0; const L = [0];
  for (let i = 1; i < pts.length; i++) { total += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); L.push(total); }
  if (closed) total += Math.hypot(pts[0][0] - pts[pts.length-1][0], pts[0][1] - pts[pts.length-1][1]);
  const k1 = Math.max(2, Math.round(total * s * 0.03 / (2*Math.PI))), k2 = k1 * 2 + 1;
  const ph = [1, 2, 3, 4].map(j => hash(BOIL * 7919 + id * 131 + j) * Math.PI * 2);
  return pts.map((p, i) => {
    const a = (L[i] / (total || 1)) * Math.PI * 2;
    return [p[0] + A * (Math.sin(k1*a + ph[0]) + 0.5*Math.sin(k2*a + ph[1])) / 1.5,
            p[1] + A * (Math.sin(k1*a + ph[2]) + 0.5*Math.sin(k2*a + ph[3])) / 1.5];
  });
}
function trace(P, closed) {
  ctx.beginPath();
  P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  if (closed) ctx.closePath();
}
// sk: the one drawing primitive. o = { closed, fill, stroke, width, amp, alpha }
function sk(pts, o = {}) {
  const P = boil(pts, o.amp === undefined ? INK.boil : o.amp, o.closed);
  trace(P, o.closed);
  const a = ctx.globalAlpha; if (o.alpha !== undefined) ctx.globalAlpha = a * o.alpha;
  if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
  if (o.stroke !== false) {
    ctx.strokeStyle = o.stroke || COLORS.ink; ctx.lineWidth = o.width || INK.width;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  }
  ctx.globalAlpha = a;
}
function seg(a, b, step = 22) {
  const n = Math.max(1, Math.ceil(Math.hypot(b[0]-a[0], b[1]-a[1]) / step)), out = [];
  for (let i = 0; i <= n; i++) out.push([lerp(a[0], b[0], i/n), lerp(a[1], b[1], i/n)]);
  return out;
}
function poly(corners, closed = true, step = 22) {
  const out = [], n = corners.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) out.push(...seg(corners[i], corners[(i + 1) % n], step).slice(0, -1));
  if (!closed) out.push(corners[n - 1]);
  return out;
}
const rect = (x, y, w, h) => poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]]);
function rrect(x, y, w, h, r, step = 22) {
  r = Math.min(r, w/2, h/2);
  const out = [], arc = (cx, cy, a0) => { for (let i = 0; i <= 6; i++) { const a = a0 + i/6 * Math.PI/2; out.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]); } };
  out.push(...seg([x + r, y], [x + w - r, y], step).slice(0, -1)); arc(x + w - r, y + r, -Math.PI/2);
  out.push(...seg([x + w, y + r], [x + w, y + h - r], step).slice(1, -1)); arc(x + w - r, y + h - r, 0);
  out.push(...seg([x + w - r, y + h], [x + r, y + h], step).slice(1, -1)); arc(x + r, y + h - r, Math.PI/2);
  out.push(...seg([x, y + h - r], [x, y + r], step).slice(1, -1)); arc(x + r, y + r, Math.PI);
  return out;
}
function ellipse(cx, cy, rx, ry, n = 32) {
  const out = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; out.push([cx + rx*Math.cos(a), cy + ry*Math.sin(a)]); }
  return out;
}
const circle = (cx, cy, r) => ellipse(cx, cy, r, r, Math.max(14, Math.round(r * 0.8)));
function chaikin(P, n = 2) {
  for (let k = 0; k < n; k++) {
    const out = [];
    for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; out.push(lerp2(a, b, 0.25), lerp2(a, b, 0.75)); }
    P = out;
  }

function drawSheet(t, layer) {

  const g = c.getContext('2d'), img = g.createImageData(320, 320);
  let seed = 12345; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < img.data.length; i += 4) {
    const v = rnd();
    img.data[i] = img.data[i+1] = img.data[i+2] = v > 0.5 ? 255 : 40;
    img.data[i+3] = Math.round(Math.pow(Math.abs(v - 0.5) * 2, 3) * 38);
  }
  g.putImageData(img, 0, 0);
  g.strokeStyle = 'rgba(120,100,70,0.06)'; g.lineWidth = 0.8;
  for (let i = 0; i < 70; i++) { const x = rnd() * 320, y = rnd() * 320, a = rnd() * 6.28, l = 6 + rnd() * 18; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  grain = ctx.createPattern(c, 'repeat');
}

// Motion blur: when the camera moves fast the frame is smeared along its motion,
// except the subject it is tracking, which is drawn sharp on top.
let TRACKED = null;
const SHUTTER = 0.75 / FPS;             // real seconds the shutter is open
function trackedAt(t) {
  if (t > 10.9 && t < 12.2) return 'sheet';
  if (t > 21.15 && t < 21.9) return 'parcel';
  if (t > 24.4 && t < 27.1) return 'van';
  return null;
}
const smearCanvas = document.createElement('canvas'), smearCtx = smearCanvas.getContext('2d');
function drawTracked(t, who) {
  if (who === 'van') drawVan(t);
  else if (who === 'parcel') drawParcel(t);
  else if (who === 'sheet') drawSheet(t, 'flap');
}
function drawFrame(tIn) {
  const r = ((tIn % DURATION) + DURATION) % DURATION, t = storyAt(r);
  BOIL = Math.floor(r * FPS / BOIL_EVERY);
  STROKE = 0;
  const fit = PORTRAIT ? PORTRAIT_VIEW.fit : 1;
  BASE_SCALE = K * fit;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  ctx.fillStyle = COLORS.paper; ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.translate(W / 2, H / 2); ctx.scale(fit, fit);
  ctx.translate(PORTRAIT ? -PORTRAIT_VIEW.cx : -960, PORTRAIT ? -PORTRAIT_VIEW.cy : -540);

  const c = camera(t), blur = focusBlur(t);
  // how far the world slides across the screen while the shutter is open (stage px)
  const cp = camera(storyAt(Math.max(0, r - SHUTTER)));
  const mv = cp.world === c.world ? [(cp.cx - c.cx) * c.zoom, (cp.cy - c.cy) * c.zoom] : [0, 0];
  const smear = Math.hypot(mv[0], mv[1]);
  const useSmear = blur <= 0.01 && smear > 5;
  TRACKED = useSmear ? trackedAt(t) : null;
  const applyCam = () => { ctx.translate(960, 540); ctx.rotate(c.roll); ctx.scale(c.zoom, c.zoom); ctx.translate(-c.cx, -c.cy); };
  if (blur > 0.01 || useSmear) {         // render the world offscreen, then composite it blurred or smeared
    const off = useSmear ? smearCanvas : focusCanvas, octx = useSmear ? smearCtx : focusCtx;
    if (off.width !== canvas.width || off.height !== canvas.height) { off.width = canvas.width; off.height = canvas.height; }
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.fillStyle = COLORS.paper; octx.fillRect(0, 0, canvas.width, canvas.height);
    octx.setTransform(MAIN_CTX.getTransform());
    ctx = octx;
  }
  ctx.save(); applyCam();
  if (c.world === 'street') drawStreet(t); else drawMain(t, c);
  ctx.restore();
  if (ctx !== MAIN_CTX) {
    const off = ctx.canvas; ctx = MAIN_CTX;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (useSmear) {                      // equal-weight average of copies spread along the motion
      const n = Math.min(12, Math.ceil(smear / 3)) + 1, sc = K * fit;
      for (let i = 0; i < n; i++) { const u = i / (n - 1) - 0.5; ctx.globalAlpha = 1 / (i + 1); ctx.drawImage(off, mv[0] * u * sc, mv[1] * u * sc); }
      ctx.globalAlpha = 1;
    } else { ctx.filter = `blur(${(9 * K * blur).toFixed(2)}px)`; ctx.drawImage(off, 0, 0); ctx.filter = 'none'; }
    ctx.restore();
    if (TRACKED) { const keep = TRACKED; TRACKED = null; ctx.save(); applyCam(); drawTracked(t, keep); ctx.restore(); }
  }
  TRACKED = null;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = grain; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const vg = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.35, canvas.width / 2, canvas.height / 2, Math.hypot(canvas.width, canvas.height) * 0.6);
  vg.addColorStop(0, 'rgba(90,70,40,0)'); vg.addColorStop(1, `rgba(90,70,40,${(0.10 + 0.16 * slowEnv(t)).toFixed(3)})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, canvas.width, canvas.height);
}

/* ==========================================================================
   Canvas sizing + review controls (the only code that reads a clock).
   ========================================================================== */

const params = new URLSearchParams(location.search);
const NATIVE = params.get('native') === '1';
if (params.get('ui') === '0') document.body.classList.add('noui');
PORTRAIT = params.get('portrait') === '1';

function resize() {
  W = PORTRAIT ? 1080 : 1920; H = PORTRAIT ? 1920 : 1080;
  const stage = document.getElementById('stage');
  const pad = document.body.classList.contains('noui') ? 0 : 24;
  const aw = stage.clientWidth - pad, ah = stage.clientHeight - pad;
  const cssW = Math.max(10, Math.min(aw, ah * W / H)), cssH = cssW * H / W;
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  const dpr = window.devicePixelRatio || 1;
  canvas.width = NATIVE ? W : Math.max(2, Math.round(cssW * dpr));
  canvas.height = NATIVE ? H : Math.max(2, Math.round(cssH * dpr));
  K = canvas.width / W;
  if (!grain) buildGrain();
  document.getElementById('orient').textContent = PORTRAIT ? '9:16' : '16:9';
  drawFrame(currentTime());
}

const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), sceneSel = document.getElementById('scene');
const ICON_PLAY = '<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>';
let playing = !params.has('t'), origin = performance.now(), held = params.has('t') ? parseFloat(params.get('t')) || 0 : 0, scrubbing = false;

function currentTime() { return playing ? ((performance.now() - origin) / 1000) % DURATION : held; }
function setPlaying(p) { const t = currentTime(); playing = p; if (p) origin = performance.now() - t * 1000; else held = t; playBtn.innerHTML = p ? ICON_PAUSE : ICON_PLAY; }
function seek(t) { held = ((t % DURATION) + DURATION) % DURATION; origin = performance.now() - held * 1000; drawFrame(held); updateUI(held); }
function updateUI(t) {
  if (!scrubbing) scrub.value = t.toFixed(3);
  timeEl.innerHTML = `<b>${t.toFixed(2).padStart(5, '0')}</b> / ${DURATION.toFixed(2)}`;
  const st = storyAt(t), sc = SCENES.find(s => st >= s.t0 && st < s.t1); if (sc && document.activeElement !== sceneSel) sceneSel.value = String(sc.id);
}
scrub.max = DURATION.toFixed(3);

SCENES.forEach(s => {
  const o = document.createElement('option'); o.value = s.id; o.textContent = `${s.id}. ${s.name}`; sceneSel.appendChild(o);
  if (s.t0 > 0) { const d = document.createElement('div'); d.className = 'tick'; d.style.left = `calc(6px + (100% - 12px) * ${realAt(s.t0) / DURATION})`; document.getElementById('track').appendChild(d); }
});

playBtn.addEventListener('click', () => setPlaying(!playing));
scrub.addEventListener('input', () => { scrubbing = true; if (playing) setPlaying(false); seek(parseFloat(scrub.value)); });
scrub.addEventListener('change', () => { scrubbing = false; });
sceneSel.addEventListener('change', () => { const s = SCENES.find(x => x.id === +sceneSel.value); seek(realAt(s.t0)); if (!playing) setPlaying(true); });
document.getElementById('orient').addEventListener('click', () => { PORTRAIT = !PORTRAIT; resize(); });
window.addEventListener('keydown', e => {
  if (e.target === sceneSel) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { e.preventDefault(); if (playing) setPlaying(false); seek(currentTime() + (e.code === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 1 : 1 / FPS)); }
});
window.addEventListener('resize', resize);
function loop() { if (playing) { const t = currentTime(); drawFrame(t); updateUI(t); } requestAnimationFrame(loop); }

playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
resize(); updateUI(currentTime()); requestAnimationFrame(loop);

window.renderFrame = t => { if (playing) setPlaying(false); held = t; drawFrame(t); updateUI(((t % DURATION) + DURATION) % DURATION); };
window.setPortrait = p => { PORTRAIT = !!p; resize(); };
window.DURATION = DURATION;
</script>
</body>
</html>
